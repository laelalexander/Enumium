# Structural PETG profile for the robot arm parts. PrusaSlicer config (also the settings to mirror in Bambu Studio).
# Machine: 256 x 256 x 256 mm bed, 0.4 mm nozzle, 1.75 mm filament. Generic start/end G-code (reference slice only).
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 256
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 25
filament_type = PETG
gcode_flavor = marlin2
use_relative_e_distances = 1
temperature = 250
first_layer_temperature = 255
bed_temperature = 70
first_layer_bed_temperature = 70
layer_height = 0.2
first_layer_height = 0.2
perimeters = 5
top_solid_layers = 6
bottom_solid_layers = 5
fill_density = 40%
fill_pattern = gyroid
infill_overlap = 25%
seam_position = aligned
extrusion_width = 0.45
perimeter_speed = 60
external_perimeter_speed = 40
infill_speed = 100
solid_infill_speed = 80
top_solid_infill_speed = 50
first_layer_speed = 25
travel_speed = 200
retract_length = 0.8
retract_speed = 35
min_fan_speed = 30
max_fan_speed = 50
bridge_fan_speed = 80
support_material_contact_distance = 0.2
support_material_threshold = 45
support_material_style = snug
brim_type = outer_only
skirts = 0
machine_max_acceleration_extruding = 4000
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
start_gcode = ; generic start for the reference slice\nM140 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG92 E0
end_gcode = M104 S0\nM140 S0\nG1 Z{max_layer_z + 10} F600\nM84
layer_gcode = G92 E0
