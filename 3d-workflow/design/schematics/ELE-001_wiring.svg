troke="#111" stroke-width="1.5"/><text x="1108" y="78" font-size="14" font-weight="bold">J1 YAW</text><text x="1108" y="100" font-size="11">NEMA23 20:1</text><text x="1108" y="115" font-size="11">A+ A- B+ B- (twisted pair)</text><text x="1108" y="130" font-size="11">limit switch NC -&gt; D22</text><text x="1108" y="145" font-size="11">CH 0 in firmware</text><path d="M930,115 L1100,115" stroke="#6a1b9a" stroke-width="2" fill="none"/><text x="934" y="111" font-size="10" fill="#6a1b9a">A+/A-/B+/B-</text><path d="M610,100 L700,100 L700,110 L780,110" stroke="#1565c0" stroke-width="2" fill="none"/><path d="M780,160 L740,160 L740,790" stroke="#d84315" stroke-width="2" fill="none"/><path d="M780,170 L760,170 L760,880" stroke="#212121" stroke-width="1.5" fill="none"/><rect x="780" y="210" width="150" height="120" fill="#f3e5f5" stroke="#111" stroke-width="1.5"/><text x="788" y="228" font-size="14" font-weight="bold">DRIVER 1  DM542</text><text x="788" y="250" font-size="11">PUL+ DIR+ ENA+ &lt;- 5V</text><text x="788" y="265" font-size="11">PUL- &lt;- D3</text><text x="788" y="280" font-size="11">DIR- &lt;- D8</text><text x="788" y="295" font-size="11">ENA- &lt;- D12</text><text x="788" y="310" font-size="11">VCC GND &lt;- 24V</text><rect x="1100" y="210" width="220" height="120" fill="#e0f7fa" stroke="#111" stroke-width="1.5"/><text x="1108" y="228" font-size="14" font-weight="bold">J2 SHOULDER</text><text x="1108" y="250" font-size="11">NEMA23 20:1 + 5:1 belt</text><text x="1108" y="265" font-size="11">A+ A- B+ B- (twisted pair)</text><text x="1108" y="280" font-size="11">limit switch NC -&gt; D23</text><text x="1108" y="295" font-size="11">CH 1 in firmware</text><path d="M930,265 L1100,265" stroke="#6a1b9a" stroke-width="2" fill="none"/><text x="934" y="261" font-size="10" fill="#6a1b9a">A+/A-/B+/B-</text><path d="M610,112 L700,112 L700,260 L780,260" stroke="#1565c0" stroke-width="2" fill="none"/><path d="M780,310 L740,310 L740,790" stroke="#d84315" stroke-width="2" fill="none"/><path d="M780,320 L760,320 L760,880" stroke="#212121" stroke-width="1.5" fill="none"/><rect x="780" y="360" width="150" height="120" fill="#f3e5f5" stroke="#111" stroke-width="1.5"/><text x="788" y="378" font-size="14" font-weight="bold">DRIVER 2  DM542</text><text x="788" y="400" font-size="11">PUL+ DIR+ ENA+ &lt;- 5V</text><text x="788" y="415" font-size="11">PUL- &lt;- D4</text><text x="788" y="430" font-size="11">DIR- &lt;- D9</text><text x="788" y="445" font-size="11">ENA- &lt;- D12</text><text x="788" y="460" font-size="11">VCC GND &lt;- 24V</text><rect x="1100" y="360" width="220" height="120" fill="#e0f7fa" stroke="#111" stroke-width="1.5"/><text x="1108" y="378" font-size="14" font-weight="bold">J3 ELBOW</text><text x="1108" y="400" font-size="11">NEMA23 20:1 + 3:1 belt</text><text x="1108" y="415" font-size="11">A+ A- B+ B- (twisted pair)</text><text x="1108" y="430" font-size="11">limit switch NC -&gt; D24</text><text x="1108" y="445" font-size="11">CH 2 in firmware</text><path d="M930,415 L1100,415" stroke="#6a1b9a" stroke-width="2" fill="none"/><text x="934" y="411" font-size="10" fill="#6a1b9a">A+/A-/B+/B-</text><path d="M610,124 L700,124 L700,410 L780,410" stroke="#1565c0" stroke-width="2" fill="none"/><path d="M780,460 L740,460 L740,790" stroke="#d84315" stroke-width="2" fill="none"/><path d="M780,470 L760,470 L760,880" stroke="#212121" stroke-width="1.5" fill="none"/><rect x="780" y="510" width="150" height="120" fill="#f3e5f5" stroke="#111" stroke-width="1.5"/><text x="788" y="528" font-size="14" font-weight="bold">DRIVER 3  DM542</text><text x="788" y="550" font-size="11">PUL+ DIR+ ENA+ &lt;- 5V</text><text x="788" y="565" font-size="11">PUL- &lt;- D5</text><text x="788" y="580" font-size="11">DIR- &lt;- D10</text><text x="788" y="595" font-size="11">ENA- &lt;- D12</text><text x="788" y="610" font-size="11">VCC GND &lt;- 24V</text><rect x="1100" y="510" width="220" height="120" fill="#e0f7fa" stroke="#111" stroke-width="1.5"/><text x="1108" y="528" font-size="14" font-weight="bold">J4 WRIST</text><text x="1108" y="550" font-size="11">NEMA23 20:1 + 1:1 belt</text><text x="1108" y="565" font-size="11">A+ A- B+ B- (twisted pair)</text><text x="1108" y="580" font-size="11">limit switch NC -&gt; D25</text><text x="1108" y="595" font-size="11">CH 3 in firmware</text><path d="M930,565 L1100,565" stroke="#6a1b9a" stroke-width="2" fill="none"/><text x="934" y="561" font-size="10" fill="#6a1b9a">A+/A-/B+/B-</text><path d="M610,136 L700,136 L700,560 L780,560" stroke="#1565c0" stroke-width="2" fill="none"/><path d="M780,610 L740,610 L740,790" stroke="#d84315" stroke-width="2" fill="none"/><path d="M780,620 L760,620 L760,880" stroke="#212121" stroke-width="1.5" fill="none"/><rect x="780" y="660" width="150" height="120" fill="#f3e5f5" stroke="#111" stroke-width="1.5"/><text x="788" y="678" font-size="14" font-weight="bold">DRIVER 4  TB6600</text><text x="788" y="700" font-size="11">PUL+ DIR+ ENA+ &lt;- 5V</text><text x="788" y="715" font-size="11">PUL- &lt;- D6</text><text x="788" y="730" font-size="11">DIR- &lt;- D11</text><text x="788" y="745" font-size="11">ENA- &lt;- D12</text><text x="788" y="760" font-size="11">VCC GND &lt;- 24V</text><rect x="1100" y="660" width="220" height="120" fill="#e0f7fa" stroke="#111" stroke-width="1.5"/><text x="1108" y="678" font-size="14" font-weight="bold">J5 GRIPPER</text><text x="1108" y="700" font-size="11">NEMA17 + T8 screw</text><text x="1108" y="715" font-size="11">A+ A- B+ B- (twisted pair)</text><text x="1108" y="730" font-size="11">limit switch NC -&gt; D26</text><text x="1108" y="745" font-size="11">CH 4 in firmware</text><path d="M930,715 L1100,715" stroke="#6a1b9a" stroke-width="2" fill="none"/><text x="934" y="711" font-size="10" fill="#6a1b9a">A+/A-/B+/B-</text><path d="M610,148 L700,148 L700,710 L780,710" stroke="#1565c0" stroke-width="2" fill="none"/><path d="M780,760 L740,760 L740,790" stroke="#d84315" stroke-width="2" fill="none"/><path d="M780,770 L760,770 L760,880" stroke="#212121" stroke-width="1.5" fill="none"/><path d="M230,125 L290,125 L290,250 L170,250" stroke="#d84315" stroke-width="3" fill="none"/><text x="234" y="121" font-size="10" fill="#d84315">V+ 24 V</text><path d="M115,280 L115,330" stroke="#d84315" stroke-width="3" fill="none"/><path d="M190,365 L330,365 L330,840 L740,840" stroke="#d84315" stroke-width="3" fill="none"/><text x="194" y="361" font-size="10" fill="#d84315">V+ -> drivers</text><path d="M740,790 L740,840" stroke="#d84315" stroke-width="3" fill="none"/><path d="M145,170 L145,190 L30,190 L30,880 L1000,880" stroke="#212121" stroke-width="3" fill="none"/><text x="149" y="166" font-size="10" fill="#212121">GND bus (PSU V-, driver GND)</text><text x="60" y="915" font-size="12">Legend: red = 24 V power (14 AWG); black = GND; blue = Mega signals (22 AWG); purple = motor phases (twisted/shielded).</text><text x="60" y="933" font-size="12">Common-anode: Mega 5 V to PUL+/DIR+/ENA+; Mega pins sink to PUL-/DIR-/ENA-.</text><text x="60" y="951" font-size="12">Driver DIP: current per motor (NEMA23 about 3.0 A peak, NEMA17 about 1.5 A), 800 pulses/rev.</text><text x="60" y="969" font-size="12">E-stop: cut 24 V; also wire a 2nd NC contact so D12 (ENA) goes high on E-stop.</text><text x="60" y="987" font-size="12">Limit switches: COM to GND, NC to D22..D26 (INPUT_PULLUP); 100 nF across each; keep away from motor leads.</text><text x="60" y="1005" font-size="12">Tie GND once at the PSU V- bus (Mega signal GND via driver signal side only).</text>
