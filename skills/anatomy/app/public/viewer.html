<style>
:root { --holo: #5ff3ff; --holo2: #8a7dff; --text: #d8fbff; --muted: #6fa9b3; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 60%, #06222b 0%, #020a0e 70%); color: var(--text);
  font: 13px/1.5 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
canvas { display: block; } .hidden { display: none !important; }
.hud { position: fixed; pointer-events: none; text-shadow: 0 0 8px #5ff3ff88; }
.tl { top: 14px; left: 16px; } .tr { top: 14px; right: 16px; text-align: right; max-width: min(300px, 40vw); } .bl { bottom: 14px; left: 16px; } .br { bottom: 14px; right: 16px; }
.title { font-size: 15px; font-weight: 600; letter-spacing: .04em; max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: .2em; color: var(--holo); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--holo); box-shadow: 0 0 10px var(--holo); animation: p 1.2s infinite; }
.live.idle { color: var(--muted); } .live.idle i { background: var(--muted); box-shadow: none; animation: none; }
@keyframes p { 50% { opacity: .25; } }
.sub { color: var(--muted); font-size: 11px; letter-spacing: .08em; }
.parts { margin-top: 8px; max-height: 40vh; overflow-y: auto; overflow-x: hidden; pointer-events: auto; font-size: 11px; color: var(--muted); }
.parts div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; transition: color 2s; }
.parts div.new { color: var(--holo); } .parts div.done { color: var(--text); }
.ctl { pointer-events: auto; display: flex; gap: 6px; }
.ctl button { background: #06303a99; border: 1px solid #1f6b78; color: var(--text); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.ctl button.on { border-color: var(--holo); box-shadow: 0 0 10px #5ff3ff55 inset; }
.style { pointer-events: auto; display: flex; gap: 10px; align-items: center; margin-top: 8px; background: #06303a99; border: 1px solid #1f6b78; border-radius: 10px; padding: 6px 10px; font-size: 11px; color: var(--muted); }
.style input[type=color] { width: 26px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; }
.style input[type=range] { width: 80px; accent-color: var(--holo); }
.info { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); width: 300px; max-height: 80vh; overflow: auto; pointer-events: auto;
  background: #04161cdd; border: 1px solid #1f6b78; border-radius: 14px; padding: 14px; box-shadow: 0 0 30px #5ff3ff22; backdrop-filter: blur(4px); }
.info h3 { margin: 0 0 2px; font-size: 14px; word-break: break-all; } .info .p { color: var(--muted); font-size: 11px; word-break: break-all; margin-bottom: 8px; }
.info table { width: 100%; border-collapse: collapse; font-size: 12px; } .info td { padding: 3px 0; border-bottom: 1px solid #0f3a42; } .info td:first-child { color: var(--muted); width: 74px; }
.info .k { color: var(--muted); font-size: 10px; letter-spacing: .15em; margin: 10px 0 4px; }
.info a { color: var(--holo); cursor: pointer; display: block; font-size: 12px; word-break: break-all; }

.parts div { pointer-events: auto; cursor: pointer; } .parts div.sel { color: #ffd36b; }
.toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); max-width: 520px; background: #04161cee; border: 1px solid #1f6b78; border-radius: 10px; padding: 8px 14px; font-size: 12px; color: var(--text); box-shadow: 0 0 20px #5ff3ff22; }
.card { position: fixed; left: 16px; top: 92px; width: 340px; max-height: calc(100vh - 230px); overflow: auto; pointer-events: auto;
  background: #04161cdd; border: 1px solid #1f6b78; border-radius: 14px; padding: 12px 14px; box-shadow: 0 0 30px #5ff3ff22; backdrop-filter: blur(4px); font-size: 12px; }
.card .k { color: var(--muted); font-size: 10px; letter-spacing: .15em; margin: 10px 0 4px; } .card h3 { margin: 2px 0 6px; font-size: 15px; }
.card img { width: 100%; border-radius: 8px; border: 1px solid #0f3a42; cursor: zoom-in; background: #fff; }
.card label { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; border-bottom: 1px solid #0f3a42; cursor: pointer; } .card label input { accent-color: #ffd36b; margin-top: 2px; }
.card label.got { color: var(--muted); text-decoration: line-through; } .card .src { color: var(--muted); font-size: 10px; }
.card .ctlrow { display: flex; gap: 6px; margin-top: 10px; } .card .ctlrow button { flex: 1; background: #06303a99; border: 1px solid #1f6b78; color: var(--text); border-radius: 8px; padding: 6px 4px; font: inherit; cursor: pointer; }
.card .ctlrow button.on { border-color: var(--holo); box-shadow: 0 0 10px #5ff3ff55 inset; } .card .ctlrow button:disabled { opacity: .35; cursor: default; }
.zoom { position: fixed; inset: 0; background: #000c; display: grid; place-items: center; z-index: 10; cursor: zoom-out; } .zoom img { max-width: 94vw; max-height: 94vh; background: #fff; border-radius: 8px; }

<body>
<div class="scan"></div>
<div class="hud tl"><div class="live" id="live"><i></i>LIVE</div><div class="title" id="title">Anatomy</div><div class="sub" id="sub">waiting for geometry…</div></div>
<div class="hud tr"><div class="sub" id="partsHdr">PARTS</div><div class="parts" id="parts"></div></div>
<div class="hud bl"><div class="ctl" id="mode"><button data-m="holo" class="on">Hologram</button><button data-m="outline">Outline</button><button data-m="solid">Solid</button></div>
  <div class="style"><label>Color <input type="color" id="col" value="#5ff3ff"></label><label>Tint <input type="color" id="tint" value="#8a7dff"></label>
  <label>Glow <input type="range" id="glow" min="0.2" max="2" step="0.05" value="1"></label><label>Shade <input type="range" id="shade" min="0" max="1" step="0.02" value="0.35"></label><button class="ctl" id="reset" style="background:none;border:0;color:var(--muted);cursor:pointer;pointer-events:auto">reset</button></div></div>
<div class="info hidden" id="info"></div>
<div class="card hidden" id="card"></div>
<div class="hud br"><div class="ctl"><button id="spin" class="on">Auto-rotate</button><button id="tbl" title="Lay every part out side by side on the table">Table</button><button id="asm" title="Move every part into its place in the finished product">Assemble</button><button id="fit">Fit</button></div></div>
<div class="toast hidden" id="toast"></div>
<div class="empty" id="empty"><span id="emptyT">NO 3D GEOMETRY YET</span><br><span style="font-size:11px">Parts appear here as Anatomy writes STL, 3MF, OBJ or GLB files.</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const id = new URLSearchParams(location.search).get('id');
const $ = s => document.querySelector(s);
const api = p => fetch(p, { cache: 'no-store' }).then(r => r.json());
const ext = p => p.toLowerCase().split('.').pop();
const MESH = ['stl', '3mf', 'obj', 'glb'];
// Print-ready copies (sliced plates, build/2-print, PR-* files) sit at the bed origin; prefer the design parts when there are any.
const PRINTCOPY = /(^|\/)(build\/\d*-?print|print|prints|gcode|plates?|slic\w*)\/|\.gcode\.3mf$|(^|\/)PR-[^/]*$/i;
const SKIP = /(^|\/)(\.venv|venv|\.tools|node_modules|\.anatomy|__pycache__)\//;

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020a0e, 0.0006);
const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100000); cam.up.set(0, 0, 1);
const ctl = new OrbitControls(cam, renderer.domElement); ctl.enableDamping = true; ctl.autoRotate = true; ctl.autoRotateSpeed = 0.6;
scene.add(new THREE.HemisphereLight(0xbff8ff, 0x0a2a33, 1.0));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(1, -1, 2); scene.add(dl);
const root = new THREE.Group(); scene.add(root);
const asmRoot = new THREE.Group(); asmRoot.visible = false; scene.add(asmRoot); // assembly.json view

// holographic floor: polar grid and a glowing ring
const floor = new THREE.Group(); scene.add(floor);
const polar = new THREE.PolarGridHelper(1, 16, 8, 64, 0x1f6b78, 0x0f3a42); polar.rotation.x = Math.PI / 2;
polar.material.transparent = true; polar.material.opacity = 0.5; floor.add(polar);
const ring = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.015, 128), new THREE.MeshBasicMaterial({ color: 0x5ff3ff, transparent: true, opacity: 0.7, side: THREE.DoubleSide, blending: THREE.AdditiveBlending }));
floor.add(ring);

const uniforms = { uTime: { value: 0 }, uColor: { value: new THREE.Color(0x5ff3ff) }, uTint: { value: new THREE.Color(0x8a7dff) }, uGlow: { value: 1 }, uShade: { value: 0.35 } };
function holoMaterial() {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: { uTime: uniforms.uTime, uReveal: { value: 0 }, uMinZ: { value: 0 }, uMaxZ: { value: 1 }, uColor: uniforms.uColor, uTint: uniforms.uTint, uGlow: uniforms.uGlow, uShade: uniforms.uShade, uDim: { value: 1 }, uSel: { value: 0 } },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vec4 mv = viewMatrix * w;
        vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform float uTime; uniform float uReveal; uniform float uMinZ; uniform float uMaxZ; uniform vec3 uColor; uniform vec3 uTint; uniform float uGlow; uniform float uShade; uniform float uDim; uniform float uSel;
      varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main() {
        float h = (vW.z - uMinZ) / max(uMaxZ - uMinZ, 1e-3);
        if (h > uReveal) discard;
        float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 2.2);
        float scan = 0.55 + 0.45 * sin(vW.z * 0.9 - uTime * 3.0);
        float edge = smoothstep(uReveal - 0.04, uReveal, h) * step(uReveal, 0.999);
        vec3 base = mix(uColor, vec3(1.0, 0.78, 0.3), uSel);
        vec3 c = mix(base, uTint, f * 0.6) * (uShade * 0.3 + 0.85 * f * uGlow) * scan + vec3(0.7, 1.0, 1.0) * edge * 1.5;
        gl_FragColor = vec4(c * uDim, (0.05 + uShade * 0.25 + 0.7 * f) * uDim + edge);
      }`,
  });
}
const edgeMat = () => new THREE.LineBasicMaterial({ color: 0x5ff3ff, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, depthWrite: false });
const solidMat = () => new THREE.MeshStandardMaterial({ color: 0x9fd8e6, metalness: 0.2, roughness: 0.45 });

let mode = 'holo';
const parts = new Map(); // path -> { group, mtime, born }
const asmParts = new Map(); // assembly.json parts: path -> { group, born, step }
let inAsm = false;
const allParts = () => [...parts.entries(), ...asmParts.entries()];
const activeRoot = () => inAsm ? asmRoot : root;

function geometriesOf(obj) { const gs = []; obj.updateMatrixWorld(true); obj.traverse(o => { if (o.isMesh) { const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld); gs.push(g); } }); return gs; }
async function load(p) {
  const url = `/p/${id}/${p.split('/').map(encodeURIComponent).join('/')}`;
  const e = ext(p);
  if (e === 'stl') return [new STLLoader().parse(await (await fetch(url, { cache: 'no-store' })).arrayBuffer())];
  if (e === '3mf') return geometriesOf(new ThreeMFLoader().parse(await (await fetch(url, { cache: 'no-store' })).arrayBuffer()));
  if (e === 'obj') return geometriesOf(new OBJLoader().parse(await (await fetch(url, { cache: 'no-store' })).text()));
  if (e === 'glb') return geometriesOf((await new GLTFLoader().loadAsync(url)).scene);
  return [];
}
function build(geos) {
  const g = new THREE.Group(); g.userData.geos = geos;
  for (const geo of geos) {
    geo.computeVertexNormals(); // STL facet normals are often zero or missing
    const holo = new THREE.Mesh(geo, holoMaterial()); holo.userData.kind = 'holo';
    const solid = new THREE.Mesh(geo, solidMat()); solid.userData.kind = 'solid';
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), edgeMat()); edges.userData.kind = 'edges';
    g.add(holo, solid, edges);
  }
  return g;
}
function applyMode() {
  for (const [, { group }] of allParts()) group.traverse(o => {
    if (o.userData.kind === 'holo') o.visible = mode === 'holo';
    if (o.userData.kind === 'solid') o.visible = mode === 'solid';
    if (o.userData.kind === 'edges') o.visible = mode !== 'solid' || true;
    if (o.userData.kind === 'edges') o.material.color.copy(mode === 'solid' ? new THREE.Color(0x0b3b44) : uniforms.uColor.value);
  });
}
function bounds() { return new THREE.Box3().setFromObject(activeRoot()); }
let framed = false;
function frame(box) {
  const b = box && box.isBox3 ? box : bounds(); if (b.isEmpty()) return;
  const s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3()); const r = Math.max(s.x, s.y, s.z) || 1;
  ctl.target.copy(c); cam.position.copy(c).add(new THREE.Vector3(r * 1.25, -r * 1.55, r * 0.95));
  cam.near = r / 500; cam.far = r * 60; cam.updateProjectionMatrix();
  const fr = Math.max(s.x, s.y) * 0.8 || 1; floor.position.set(c.x, c.y, b.min.z); floor.scale.setScalar(fr);
  scene.fog.density = 0.25 / r;
  framed = true;
}
function updateZ() {
  const b = bounds(); if (b.isEmpty()) return;
  activeRoot().traverse(o => { if (o.material && o.material.uniforms) { o.material.uniforms.uMinZ.value = b.min.z; o.material.uniforms.uMaxZ.value = b.max.z; } });
}

// ---------------------------------------------------------------- polling the project
let lastChange = 0, running = false; const failed = new Map();
async function poll() {
  try {
    const [list, meta] = await Promise.all([api(`/api/projects/${id}/meshes`), api(`/api/projects/${id}`)]);
    $('#title').textContent = meta.title || 'Anatomy';
    running = !!meta.running;
    $('#live').classList.toggle('idle', !running); $('#live').lastChild.textContent = running ? 'LIVE' : 'IDLE';
    const docs = list.filter(f => /(^|\/)assembly\.json$/i.test(f.path) && !SKIP.test(f.path)).sort((a, b) => a.path.split('/').length - b.path.split('/').length);
    asmDoc = docs[0] || null; const asmDir = asmDoc ? asmDoc.path.replace(/(^|\/)assembly\.json$/i, '') : null;
    let meshes = list.filter(f => MESH.includes(ext(f.path)) && !SKIP.test(f.path) && !(asmDir !== null && (asmDir === '' ? false : f.path.startsWith(asmDir + '/'))));
    // Prefer an assembled export when the project has one.
    const asm = meshes.filter(f => /assembl/i.test(f.path));
    isAsm = asm.length > 0; if (isAsm) meshes = asm;
    else { const design = meshes.filter(f => !PRINTCOPY.test(f.path)); if (design.length) meshes = design; }
    meshes = meshes.sort((a, b) => b.mtime - a.mtime).slice(0, 80);
    const keep = new Set(meshes.map(f => f.path));
    for (const [p, v] of parts) if (!keep.has(p)) { root.remove(v.group); parts.delete(p); }
    let changed = false;
    for (const f of meshes) {
      const have = parts.get(f.path);
      if (have && have.mtime === f.mtime) continue;
      const age = Date.now() - f.mtime; if (age >= 0 && age < 1500) continue; // still being written (future mtimes, e.g. from an extracted zip, are fine)
      try {
        const g = build(await load(f.path));
        if (have) root.remove(have.group);
        g.userData.path = f.path; root.add(g); parts.set(f.path, { group: g, mtime: f.mtime, born: performance.now() });
        changed = true; lastChange = Date.now(); failed.delete(f.path);
      } catch (e) { failed.set(f.path, e.message || String(e)); }
    }
    if (changed) { files = []; await loadPoses().catch(() => {}); layout(); applyMode(); if (selected) highlight(selected); updateZ(); if (!framed || parts.size <= 3 || isSpread()) frame(); renderParts(); }
    $('#empty').style.display = parts.size || inAsm ? 'none' : '';
    if (!parts.size && failed.size) $("#emptyT").textContent = `${failed.size} 3D file${failed.size === 1 ? '' : 's'} found but could not be read`;
    const ago = lastChange ? Math.round((Date.now() - lastChange) / 1000) : null;
    $('#sub').textContent = `${parts.size} part${parts.size === 1 ? '' : 's'}${ago !== null ? ` · updated ${ago < 60 ? ago + 's' : Math.round(ago / 60) + 'm'} ago` : ''}`;
  } catch {}
  setTimeout(poll, 2500);
}
let selected = null, files = [], bom = null, anim = null; const partsMeta = new Map(), posesKnown = new Map();
function renderParts() {
  if (inAsm) return renderSteps();
  const list = [...parts.entries()].sort((a, b) => b[1].born - a[1].born);
  $('#parts').innerHTML = list.map(([p, v]) => `<div data-p="${p.replace(/"/g, '&quot;')}" class="${performance.now() - v.born < 8000 ? 'new' : ''} ${p === selected ? 'sel' : ''}">${p.split('/').pop()}</div>`).join('');
  setTimeout(() => $('#parts').querySelectorAll('.new').forEach(d => d.classList.remove('new')), 8000);
}

// ---------------------------------------------------------------- loop
function resize() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop); stepAnim(performance.now());
  const t = clock.getElapsedTime(); uniforms.uTime.value = t;
  const now = performance.now();
  for (const [, { group, born }] of allParts()) {
    if (!group.visible) continue;
    const k = Math.min(1, (now - born) / 2200); // materialize bottom-up over ~2 s
    group.traverse(o => {
      if (o.material && o.material.uniforms) o.material.uniforms.uReveal.value = k;
      if (o.userData.kind === 'edges') o.material.opacity = (mode === 'solid' ? 0.35 : 0.85) * k;
    });
  }
  ring.material.opacity = 0.45 + 0.25 * Math.sin(t * 2);
  ctl.update(); renderer.render(scene, cam);
})();

$('#mode').onclick = e => { const m = e.target.dataset.m; if (!m) return; mode = m; $('#mode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); applyMode(); };
$('#spin').onclick = () => { ctl.autoRotate = !ctl.autoRotate; $('#spin').classList.toggle('on', ctl.autoRotate); };
$('#fit').onclick = frame;
// Two views. Table: every part side by side. Assembled: every part moved to its place in the product.
// Parts saved one at a time (for printing, or as separate CAD files) all sit at the origin, so the default is
// Table for those and Assembled for files already saved in place. Assembly positions come from "pose" in
// parts.json (see references/build-package.md); without poses, Assembled shows the parts where their files put them.
let view = null, isAsm = false; // view: null = automatic, 'table' or 'assembled' once a button is pressed
$('#tbl').onclick = () => { if (inAsm) exitAsm(); view = 'table'; layout(true); frame(); };
$('#asm').onclick = async () => {
  if (asmDoc) return enterAsm();
  if (!isSpread()) { view = 'table'; layout(true); asmBtn(); return; } // Disassemble back onto the table
  const poses = await loadPoses();
  if (!poses.size && atOrigin()) return toast('This project has no assembly positions yet, so the parts stay on the table. Ask Anatomy to "add assembly poses to parts.json" and the Assemble button will put them together.');
  if (poses.size && poses.size < parts.size) toast(`${parts.size - poses.size} of ${parts.size} parts have no assembly position and stay where their files put them.`);
  view = 'assembled'; layout(true);
};
// ---------------------------------------------------------------- assembly.json: step-by-step build
// {units: "mm", in_place: true, parts: [{file, name, matrix?: 16 numbers column-major}], steps: [{n, title, add: [file]}]}
// Files are relative to assembly.json. Parts in no step appear first. Meshes in its folder stay off the parts table.
let asmDoc = null, asmLoaded = null, asmData = null, asmShown = 0, asmTimer = null;
const asmBase = () => asmDoc.path.replace(/assembly\.json$/i, '');
async function loadAsm() {
  const key = asmDoc.path + '@' + asmDoc.mtime; if (asmLoaded === key) return;
  const doc = await fetch(`/api/projects/${id}/file?path=${encodeURIComponent(asmDoc.path)}`, { cache: 'no-store' }).then(r => r.json());
  for (const [, v] of asmParts) asmRoot.remove(v.group); asmParts.clear();
  const steps = (doc.steps || []).map((st, i) => ({ n: st.n ?? i + 1, title: st.title || `Step ${st.n ?? i + 1}`, add: st.add || [] }));
  const stepOf = new Map(); steps.forEach((st, i) => st.add.forEach(f => stepOf.has(f) || stepOf.set(f, i + 1)));
  let bad = 0;
  await Promise.all((doc.parts || []).map(async pt => {
    const path = asmBase() + pt.file;
    try {
      const g = build(await load(path)); g.userData.path = path; g.userData.step = stepOf.get(pt.file) ?? 0; g.userData.name = pt.name;
      if (Array.isArray(pt.matrix) && pt.matrix.length === 16 && doc.in_place !== true) { g.matrix.fromArray(pt.matrix.map(Number)); g.matrix.decompose(g.position, g.quaternion, g.scale); }
      asmRoot.add(g); asmParts.set(path, { group: g, born: performance.now(), step: g.userData.step });
    } catch { bad++; }
  }));
  asmData = { steps, name: doc.name || doc.title }; asmLoaded = key; asmTable = false; applyMode();

    <table><tr><td>X</td><td>${mmin(st.s.x)}</td></tr><tr><td>Y</td><td>${mmin(st.s.y)}</td></tr><tr><td>Z</td><td>${mmin(st.s.z)}</td></tr>
    <tr><td>Volume</td><td>${(st.vol / 1000).toFixed(1)} cm³ <span style="color:var(--muted)">[${(st.vol / 16387.064).toFixed(2)} in³]</span></td></tr>
    <tr><td>Filament</td><td>≈ ${(st.vol / 1000 * 1.24).toFixed(0)} g PLA · ${(st.vol / 1000 * 1.27).toFixed(0)} g PETG (solid)</td></tr><tr><td>Triangles</td><td>${st.tris.toLocaleString()}</td></tr></table>
    ${row ? `<div class="k">BOM LINE</div><div style="font-size:12px">${esc(row.filter(Boolean).slice(0, 5).join(' · '))}</div>` : ''}
    ${rel.length ? `<div class="k">RELATED FILES</div>` + rel.slice(0, 12).map(f => `<a data-open="${esc(f.path)}">${kind(f.path)}: ${esc(f.path.split('/').pop())}</a>`).join('') : ''}
    <div class="k">ACTIONS</div><a data-open="${esc(p)}">Open in program</a><a data-reveal="${esc(p)}">Show in folder</a><a id="iso">Isolate / show all</a>`;
  $('#ix').onclick = () => select(null);
  info.querySelectorAll('[data-open]').forEach(a => a.onclick = () => fetch(`/api/projects/${id}/open?path=${encodeURIComponent(a.dataset.open)}`, { method: 'POST' }));
  info.querySelectorAll('[data-reveal]').forEach(a => a.onclick = () => fetch(`/api/projects/${id}/reveal?path=${encodeURIComponent(a.dataset.reveal)}`, { method: 'POST' }));
  let iso = false; $('#iso').onclick = () => { iso = !iso; for (const [path, { group }] of (inAsm ? asmParts : parts)) group.visible = (!iso || path === p) && !(inAsm && group.userData.step > asmShown); };
  info.classList.remove('hidden');
}
// parts.json next to the part files, keyed by file name: {name, part_no, category, qty, material, note, drawing}
async function loadPartsMeta(p) {
  const dir = p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : '';
  if (!partsMeta.has(dir)) {
    const url = `/api/projects/${id}/file?path=${encodeURIComponent((dir ? dir + '/' : '') + 'parts.json')}`;
    partsMeta.set(dir, fetch(url).then(r => r.ok ? r.json() : null).catch(() => null));
  }
  const all = await partsMeta.get(dir); if (!all || typeof all !== 'object') return null;
  const file = p.split('/').pop(), stem = file.replace(/\.[^.]+$/, '');
  const m = all[file] || all[stem] || Object.entries(all).find(([k]) => k.toLowerCase() === file.toLowerCase() || k.replace(/\.[^.]+$/, '').toLowerCase() === stem.toLowerCase())?.[1];
  if (!m) return null;
  let drawingPath = m.drawing;
  if (m.drawing && !files.some(f => f.path === m.drawing)) {
    const hit = files.find(f => f.path.endsWith('/' + String(m.drawing).replace(/^\.?\//, '')) || f.path.split('/').pop() === String(m.drawing).split('/').pop());
    if (hit) drawingPath = hit.path;
  }
  return { ...m, drawingPath };
}
async function loadBom() {
  const f = files.find(f => /(^|\/)bom\.csv$/i.test(f.path)) || files.find(f => /bom.*\.csv$/i.test(f.path));
  if (!f) return false;
  const t = await fetch(`/api/projects/${id}/file?path=${encodeURIComponent(f.path)}`).then(r => r.text()).catch(() => '');
  return t.split(/\r?\n/).slice(1).map(l => l.split(',').map(x => x.replace(/^"|"$/g, '').trim()));
}
