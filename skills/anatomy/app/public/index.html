<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anatomy</title>
<style>
:root {
  --bg: #0e1013; --panel: #15181d; --panel2: #1b1f26; --line: #262b34; --text: #e7e9ee; --muted: #8b93a1;
  --faint: #5d6574; --accent: #7aa2ff; --accent2: #a98bff; --ok: #4fd18b; --warn: #f2c94c; --err: #ff6b6b;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.55 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
.hidden { display: none !important; }

/* ---------- home ---------- */
#home { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: 9vh 24px 48px; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.brand svg { width: 34px; height: 34px; }
.brand h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.tag { color: var(--muted); margin: 0 0 32px; text-align: center; }
.composer { width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 18px 12px; transition: border-color .15s; }
.composer:focus-within, .composer.drag { border-color: #3a4560; }
.composer textarea { width: 100%; min-height: 120px; resize: vertical; background: transparent; border: 0; outline: 0;
  color: var(--text); font: 16px/1.5 inherit; font-family: inherit; }
.composer textarea::placeholder { color: var(--faint); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted); }
.chip button { background: none; border: 0; color: var(--faint); padding: 0; }
.bar { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; color: var(--muted); }
.ghost:hover { color: var(--text); border-color: #3a4150; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 7px 12px; color: var(--muted); }
.seg button.on { background: var(--panel2); color: var(--text); }
.spacer { flex: 1; }
.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0b0d12; border: 0;
  border-radius: 10px; padding: 8px 18px; font-weight: 600; }
.primary:disabled { opacity: .45; cursor: default; }
.examples { width: min(760px, 100%); display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.examples button { background: transparent; border: 1px dashed var(--line); border-radius: 999px; padding: 5px 12px;
  color: var(--muted); font-size: 13px; }
.examples button:hover { color: var(--text); border-color: #3a4150; }
.recent { width: min(760px, 100%); margin-top: 44px; }
.recent h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; margin: 0 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.card:hover { border-color: #3a4150; }
.card .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .m { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; gap: 8px; align-items: center; }
.banner { width: min(760px, 100%); background: #2a2212; border: 1px solid #4a3a16; color: #f4dc9a; border-radius: 12px;
  padding: 10px 14px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }

/* ---------- status pill ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px;
  background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.pill.running { color: var(--accent); } .pill.running::before { background: var(--accent); animation: pulse 1.2s infinite; }
.pill.done { color: var(--ok); } .pill.done::before { background: var(--ok); }
.pill.failed { color: var(--err); } .pill.failed::before { background: var(--err); }
@keyframes pulse { 50% { opacity: .3; } }

/* ---------- run view ---------- */
#run { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header.top .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }
.grid { display: grid; grid-template-columns: 230px 1fr 300px; min-height: 0; }
aside { border-right: 1px solid var(--line); padding: 18px 14px; overflow: auto; }
aside.right { border-right: 0; border-left: 1px solid var(--line); }
.sect { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; margin: 0 0 10px; }
.phases { list-style: none; margin: 0 0 24px; padding: 0; }
.phases li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; color: var(--faint); position: relative; }
.phases li .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 1px;
  display: grid; place-items: center; font-size: 10px; }
.phases li.active { color: var(--text); } .phases li.active .dot { border-color: var(--accent); box-shadow: 0 0 0 4px #7aa2ff22; }
.phases li.active .dot::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
.phases li.done { color: var(--muted); } .phases li.done .dot { background: var(--ok); border-color: var(--ok); color: #0b0d12; }
.phases li.done .dot::after { content: "✓"; font-weight: 700; }
.todos { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.todos li { padding: 3px 0; color: var(--muted); display: flex; gap: 8px; }
.todos li.completed { color: var(--faint); text-decoration: line-through; }
.todos li.in_progress { color: var(--text); }
.stats { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.8; }

main.feed { display: flex; flex-direction: column; min-height: 0; }
#stream { flex: 1; overflow: auto; padding: 22px clamp(16px, 4vw, 48px) 40px; }
.msg { margin: 0 0 14px; max-width: 820px; }
.msg.user { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; color: var(--muted); }
.msg.user b { color: var(--text); font-weight: 600; }
.say { color: var(--text); }
.say p { margin: 0 0 8px; }
.say h1, .say h2, .say h3 { font-size: 15px; margin: 14px 0 6px; }
.say code { font-family: var(--mono); font-size: 12.5px; background: var(--panel2); padding: 1px 5px; border-radius: 5px; }
.say pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow: auto; }
.say pre code { background: none; padding: 0; }
.say table { border-collapse: collapse; margin: 6px 0; font-size: 13px; }
.say td, .say th { border: 1px solid var(--line); padding: 4px 8px; }
.say ul, .say ol { margin: 0 0 8px; padding-left: 22px; }
.phase-mark { display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 12px; text-transform: uppercase;
  letter-spacing: .08em; font-weight: 600; margin: 26px 0 12px; max-width: 820px; }
.phase-mark::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.step { max-width: 820px; border-left: 2px solid var(--line); margin: 0 0 2px 4px; padding: 3px 0 3px 12px; font-size: 13px; color: var(--muted); }
.step .row { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.step .ic { width: 16px; text-align: center; flex: none; color: var(--faint); }
.step .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step .lbl code { font-family: var(--mono); font-size: 12px; color: #b9c2d3; }
.step.pending .ic { color: var(--accent); animation: pulse 1.2s infinite; }
.step.err { border-left-color: #5a2a2a; } .step.err .ic { color: var(--err); }
.step .detail { display: none; margin: 6px 0 4px 24px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-height: 300px; overflow: auto; color: #b9c2d3; }
.step.open .detail { display: block; }
.step a.file { color: var(--accent); text-decoration: none; cursor: pointer; }
.alert { max-width: 820px; background: #2a1517; border: 1px solid #5a2a2a; color: #ffc9c9; border-radius: 12px; padding: 10px 14px; margin: 12px 0; white-space: pre-wrap; }
.alert .primary { margin-top: 8px; }
.summary { max-width: 820px; background: linear-gradient(180deg, #172033, var(--panel)); border: 1px solid #2c3a5a; border-radius: 14px; padding: 16px 18px; margin: 20px 0; }
.summary .h { font-weight: 600; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
.thinking { color: var(--faint); font-size: 13px; display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.thinking i { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: pulse 1s infinite; }
.reply { border-top: 1px solid var(--line); padding: 12px clamp(16px, 4vw, 48px); background: var(--panel); display: flex; gap: 10px; }
.reply textarea { flex: 1; resize: none; height: 42px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  color: var(--text); padding: 10px 12px; font: inherit; outline: 0; }

.files { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.files li { padding: 4px 6px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; color: var(--muted); }
.files li:hover { background: var(--panel2); color: var(--text); }
.files li .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files li.fresh .n { color: var(--text); }
.files li.fresh::after { content: "new"; font-size: 10px; color: var(--ok); }
.files .dir { color: var(--faint); font-size: 11px; padding: 10px 6px 2px; cursor: default; text-transform: none; }
.files .dir:hover { background: none; color: var(--faint); }
.empty { color: var(--faint); font-size: 13px; }

/* ---------- preview drawer ---------- */
#drawer { position: fixed; inset: 0; background: #0009; display: flex; justify-content: flex-end; z-index: 10; }
#drawer .panel { width: min(900px, 92vw); height: 100%; background: var(--bg); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; }
#drawer header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
#drawer header .p { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#pv { overflow: auto; padding: 22px 28px; }
#pv img { max-width: 100%; border-radius: 8px; background: #fff; }
#pv iframe { width: 100%; height: 100%; border: 0; background: #fff; }
#pv pre.code { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; margin: 0; color: #c9d1e0; }

@media (max-width: 1100px) { .grid { grid-template-columns: 200px 1fr; } aside.right { display: none; } #filesBtn { display: inline-block !important; } }
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section id="home">
  <div id="warn" class="banner hidden"></div>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7aa2ff"/><stop offset="1" stop-color="#a98bff"/></linearGradient></defs>
      <circle cx="16" cy="16" r="13" stroke="url(#g)" stroke-width="2.2"/><path d="M8 16h16M16 8v16M10.5 10.5l11 11" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/></svg>
    <h1>Anatomy</h1>
  </div>
  <p class="tag">Describe a product or system. Anatomy takes it apart, writes the blueprint, and builds it back up.</p>

  <div class="composer" id="composer">
    <textarea id="prompt" placeholder="What should Anatomy dissect and rebuild?&#10;&#10;e.g. A 7.5 inch e-ink desk display that shows calendar and weather over wifi, battery powered. Give me everything to build one."></textarea>
    <div class="chips" id="chips"></div>
    <div class="bar">
      <button class="ghost" id="attach" title="Datasheets, photos, specs">＋ Attach files</button>
      <input type="file" id="fileIn" multiple class="hidden">
      <div class="seg" id="model" title="Model">
        <button data-m="opus" class="on">Opus</button><button data-m="sonnet">Sonnet</button>
      </div>
      <div class="spacer"></div>
      <button class="primary" id="go" disabled>Start anatomy</button>
    </div>
  </div>
  <div class="examples" id="examples"></div>

  <div class="recent hidden" id="recentWrap">
    <h2>Projects</h2>
    <div class="cards" id="recent"></div>
  </div>
</section>

<!-- ================= RUN ================= -->
<section id="run" class="hidden">
  <header class="top">
    <button class="ghost" id="back">← New</button>
    <div class="title" id="rTitle"></div>
    <span class="pill" id="rStatus">idle</span>
    <div class="spacer"></div>
    <button class="ghost hidden" id="filesBtn">Files</button>
    <button class="ghost" id="reveal">Open folder</button>
    <button class="ghost hidden" id="stop">Stop</button>
  </header>
  <div class="grid">
    <aside>
      <p class="sect">Progress</p>
      <ol class="phases" id="phases"></ol>
      <div id="planWrap" class="hidden"><p class="sect">Plan</p><ul class="todos" id="todos"></ul></div>
      <div class="stats" id="stats"></div>
    </aside>
    <main class="feed">
      <div id="stream"></div>
      <div class="reply">
        <textarea id="replyIn" placeholder="Ask a follow-up or give direction (e.g. go deeper on the PCB)"></textarea>
        <button class="primary" id="replyGo">Send</button>
      </div>
    </main>
    <aside class="right">
      <p class="sect">Files produced</p>
      <ul class="files" id="files"><li class="empty">Nothing yet.</li></ul>
    </aside>
  </div>
</section>

<div id="drawer" class="hidden">
  <div class="panel">
    <header><div class="p" id="pvPath"></div><button class="ghost" id="pvReveal">Show in folder</button><button class="ghost" id="pvClose">Close</button></header>
    <div id="pv"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const PHASES = ['Scope', 'Gather evidence', 'Analyze', 'Blueprint', 'Prototype', 'Verify & hand off'];
const EXAMPLES = [
  '7.5 inch e-ink desk display: calendar and weather over wifi, battery powered. Everything needed to build one.',
  'A smart thermostat with a touchscreen and occupancy sensing',
  'The jq command line JSON processor',
  'A Hacker News style link aggregator web app',
];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = (p, o = {}) => fetch(p, o).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; });

// ---------------- tiny markdown ----------------
function md(src) {
  const blocks = []; src = String(src || '');
  src = src.replace(/```[\w-]*\n([\s\S]*?)```/g, (_, c) => { blocks.push('<pre><code>' + esc(c) + '</code></pre>'); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  const lines = src.split('\n'); let out = '', list = null, table = [];
  const flushList = () => { if (list) { out += `</${list}>`; list = null; } };
  const flushTable = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\s*\|?\s*:?-+/.test(r));
    out += '<table>' + rows.map((r, i) => '<tr>' + r.replace(/^\s*\||\|\s*$/g, '').split('|').map(c => i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join('') + '</tr>').join('') + '</table>';
    table = [];
  };
  for (const l of lines) {
    if (/^\s*\|.*\|\s*$/.test(l)) { flushList(); table.push(l); continue; } else flushTable();
    let m;
    if ((m = l.match(/^\u0000(\d+)\u0000$/))) { flushList(); out += blocks[m[1]]; }
    else if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flushList(); out += `<h3>${inline(m[2])}</h3>`; }
    else if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (list !== 'ul') { flushList(); out += '<ul>'; list = 'ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { flushList(); out += '<ol>'; list = 'ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()) { flushList(); }
    else { flushList(); out += `<p>${inline(l)}</p>`; }
  }
  flushList(); flushTable();
  return out.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

// ---------------- home ----------------
let attached = [], model = 'opus';
const promptEl = $('#prompt');
promptEl.addEventListener('input', () => $('#go').disabled = !promptEl.value.trim());
promptEl.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#go').click(); });
$('#examples').innerHTML = EXAMPLES.map(x => `<button>${esc(x.length > 60 ? x.slice(0, 58) + '…' : x)}</button>`).join('');
[...$('#examples').children].forEach((b, i) => b.onclick = () => { promptEl.value = EXAMPLES[i]; promptEl.dispatchEvent(new Event('input')); promptEl.focus(); });
$('#model').onclick = e => { const m = e.target.dataset.m; if (!m) return; model = m; [...$('#model').children].forEach(b => b.classList.toggle('on', b.dataset.m === m)); };
$('#attach').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
const comp = $('#composer');
comp.addEventListener('dragover', e => { e.preventDefault(); comp.classList.add('drag'); });
comp.addEventListener('dragleave', () => comp.classList.remove('drag'));
comp.addEventListener('drop', e => { e.preventDefault(); comp.classList.remove('drag'); addFiles(e.dataTransfer.files); });
function addFiles(list) { attached.push(...list); renderChips(); }
function renderChips() {
  $('#chips').innerHTML = attached.map((f, i) => `<span class="chip">📎 ${esc(f.name)} <button data-i="${i}">✕</button></span>`).join('');
  [...$('#chips').querySelectorAll('button')].forEach(b => b.onclick = () => { attached.splice(+b.dataset.i, 1); renderChips(); });
}
$('#go').onclick = async () => {
  const prompt = promptEl.value.trim(); if (!prompt) return;
  $('#go').disabled = true; $('#go').textContent = 'Starting…';
  try {
    const { id } = await api('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, model }) });
    for (const f of attached) await fetch(`/api/projects/${id}/upload?name=${encodeURIComponent(f.name)}`, { method: 'POST', body: f });
    await api(`/api/projects/${id}/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    attached = []; renderChips(); promptEl.value = '';
    location.hash = id;
  } catch (e) { alert('Could not start: ' + e.message); }
  $('#go').textContent = 'Start anatomy'; $('#go').disabled = !promptEl.value.trim();
};
async function loadHome() {
  try {
    const h = await api('/api/health');
    const w = $('#warn');
    if (!h.claude) { w.innerHTML = 'Claude Code is not installed on this PC. Install it from <a href="https://claude.com/claude-code" target="_blank">claude.com/claude-code</a>, then reopen Anatomy.'; w.classList.remove('hidden'); }
    else w.classList.add('hidden');
  } catch {}
  const ps = await api('/api/projects').catch(() => []);
  $('#recentWrap').classList.toggle('hidden', !ps.length);
  $('#recent').innerHTML = ps.map(p => `<button class="card" data-id="${esc(p.id)}"><div class="t">${esc(p.title)}</div>
    <div class="m"><span class="pill ${esc(p.status)}">${esc(p.status)}</span>${esc(new Date(p.updated || p.created).toLocaleString())}</div></button>`).join('');
  [...$('#recent').children].forEach(c => c.onclick = () => location.hash = c.dataset.id);
}

// ---------------- run view ----------------
let es = null, cur = null, cwd = '', pending = new Map(), phase = 0, running = false, fileSeen = new Set(), firstFiles = true, filesTimer = null, startTs = 0;
function show(view) { $('#home').classList.toggle('hidden', view !== 'home'); $('#run').classList.toggle('hidden', view !== 'run'); }
window.addEventListener('hashchange', route);
function route() {
  const id = location.hash.slice(1);
  if (es) { es.close(); es = null; } clearInterval(filesTimer);
  if (!id) { show('home'); loadHome(); promptEl.focus(); return; }
  openRun(id);
}
async function openRun(id) {
  show('run'); cur = id; cwd = ''; pending.clear(); phase = 0; running = false; fileSeen = new Set(); firstFiles = true;
  $('#stream').innerHTML = ''; $('#todos').innerHTML = ''; $('#planWrap').classList.add('hidden'); $('#stats').innerHTML = '';
  const meta = await api(`/api/projects/${id}`).catch(() => null);
  if (!meta) { location.hash = ''; return; }
  $('#rTitle').textContent = meta.title; document.title = meta.title + ' · Anatomy';
  renderPhases(); setStatus(meta.running ? 'running' : meta.status);
  es = new EventSource(`/api/projects/${id}/events`);
  es.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  refreshFiles(); filesTimer = setInterval(refreshFiles, 3000);
}
function setStatus(s) {
  running = s === 'running';
  const p = $('#rStatus'); p.className = 'pill ' + s; p.textContent = { running: 'working', done: 'done', failed: 'failed', stopped: 'stopped', new: 'ready' }[s] || s;
  $('#stop').classList.toggle('hidden', !running);
  $('#replyGo').disabled = running; $('#replyIn').disabled = running;
  $('#replyIn').placeholder = running ? 'Anatomy is working. You can follow up when it finishes.' : 'Ask a follow-up or give direction (e.g. go deeper on the PCB)';
  setThinking(running);
}
function renderPhases() {
  $('#phases').innerHTML = PHASES.map((p, i) => `<li class="${i + 1 < phase ? 'done' : i + 1 === phase ? (running ? 'active' : 'done') : ''}"><span class="dot"></span><span>${p}</span></li>`).join('');
}
function setThinking(on) {
  let t = $('#thinking');
  if (on && !t) { t = document.createElement('div'); t.id = 'thinking'; t.className = 'thinking'; t.innerHTML = '<i></i> Working…'; $('#stream').append(t); }
  if (!on && t) t.remove();
  if (on && t) $('#stream').append(t);
}
const atBottom = () => { const s = $('#stream'); return s.scrollHeight - s.scrollTop - s.clientHeight < 120; };
function add(el) { const stick = atBottom(); $('#stream').append(el); if (running) setThinking(true); if (stick) $('#stream').scrollTop = 1e9; return el; }
function div(cls, html) { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; return d; }
const rel = p => { p = String(p || ''); if (cwd && p.toLowerCase().startsWith(cwd.toLowerCase())) p = p.slice(cwd.length).replace(/^[\\/]+/, ''); return p.replace(/\\/g, '/'); };
const base = p => rel(p).split('/').pop();
const fileLink = p => `<a class="file" data-path="${esc(rel(p))}">${esc(rel(p))}</a>`;

function describe(t) {
  const i = t.input || {};
  switch (t.name) {
    case 'Read': return ['◔', `Reading ${fileLink(i.file_path)}`];
    case 'Write': return ['✎', `Writing ${fileLink(i.file_path)}`];
    case 'Edit': case 'MultiEdit': return ['✎', `Editing ${fileLink(i.file_path)}`];
    case 'Bash': return ['›', `${esc(i.description || 'Running a command')} <code>${esc((i.command || '').split('\n')[0].slice(0, 140))}</code>`];
    case 'Glob': return ['⌕', `Looking for files <code>${esc(i.pattern)}</code>`];
    case 'Grep': return ['⌕', `Searching for <code>${esc(i.pattern)}</code>`];
    case 'WebFetch': { let h = i.url; try { h = new URL(i.url).host; } catch {} return ['↯', `Fetching ${esc(h)}`]; }
    case 'WebSearch': return ['⌕', `Searching the web: ${esc(i.query)}`];
    case 'Skill': return ['✦', `Loading the ${esc(i.skill || i.command || '')} skill`];
    case 'Task': return ['⇉', `Delegating: ${esc(i.description || '')}`];
    case 'TodoWrite': return null;
    default: return ['•', esc(t.name)];
  }
}
function resultText(c) {
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.map(x => x.type === 'text' ? x.text : x.type === 'image' ? '[image]' : '').join('\n');
  return JSON.stringify(c, null, 2);
}
function handleText(text) {
  const parts = text.split(/\[\[phase:(\d)\]\]/);
  for (let k = 0; k < parts.length; k++) {
    if (k % 2) {
      const n = +parts[k]; if (n >= 1 && n <= 6) setPhase(n, true);
    } else if (parts[k].trim()) add(div('msg say', md(parts[k].trim())));
  }
}
function handle(ev) {
  if (ev.type === 'anatomy') {
    if (ev.kind === 'run-start') { add(div('msg user', `<b>You</b><br>${esc(ev.text).replace(/\n/g, '<br>')}`)); startTs = ev.ts; setStatus('running'); }
    else if (ev.kind === 'run-end') { setStatus(ev.status); if (ev.status === 'done' && phase) renderPhases(); refreshFiles(); }
    else if (ev.kind === 'error') {
      const d = div('alert', esc(ev.text));
      if (/sign in/i.test(ev.text)) { const b = document.createElement('button'); b.className = 'primary'; b.textContent = 'Sign in to Claude'; b.onclick = () => api('/api/login', { method: 'POST' }); d.append(document.createElement('br'), b); }
      add(d);
    }
    else if (ev.kind === 'replay-done') { setStatus(ev.running ? 'running' : ($('#rStatus').classList.contains('running') ? 'stopped' : $('#rStatus').className.split(' ')[1] || 'new')); $('#stream').scrollTop = 1e9; }
    else if (ev.kind === 'log') { /* raw non-JSON output; ignore */ }
    return;
  }
  if (ev.type === 'system' && ev.subtype === 'init') { cwd = ev.cwd || cwd; return; }
  if (ev.type === 'assistant' && ev.message) {
    for (const c of ev.message.content || []) {
      if (c.type === 'text') handleText(c.text);
      else if (c.type === 'tool_use') {
        if (c.name === 'TodoWrite') { renderTodos(c.input?.todos || []); continue; }
        inferPhase(c);
        const d = describe(c); if (!d) continue;
        const el = div('step pending', `<div class="row"><span class="ic">${d[0]}</span><span class="lbl">${d[1]}</span></div><div class="detail"></div>`);
        el.querySelector('.row').onclick = e => { if (!e.target.closest('a')) el.classList.toggle('open'); };
        if (c.name === 'Bash') el.querySelector('.detail').textContent = '$ ' + (c.input?.command || '');
        pending.set(c.id, el); add(el);
      }
    }
    return;
  }
  if (ev.type === 'user' && ev.message) {
    for (const c of ev.message.content || []) {
      if (c.type !== 'tool_result') continue;
      const el = pending.get(c.tool_use_id); if (!el) continue;
      el.classList.remove('pending'); if (c.is_error) el.classList.add('err');
      const det = el.querySelector('.detail'); const txt = resultText(c.content).slice(0, 6000);
      det.textContent = (det.textContent ? det.textContent + '\n\n' : '') + txt;
      pending.delete(c.tool_use_id);
    }
    return;
  }
  if (ev.type === 'result') {
    for (const el of pending.values()) el.classList.remove('pending'); pending.clear();
    const ok = !ev.is_error && ev.subtype === 'success';
    if (ok && phase >= 4) setPhase(6, false);
    const mins = ev.duration_ms ? Math.round(ev.duration_ms / 60000) : null;
    add(div('summary', `<div class="h"><span class="pill ${ok ? 'done' : 'failed'}">${ok ? 'finished' : 'stopped'}</span>${mins != null ? `<span style="color:var(--muted);font-size:12px">${mins} min</span>` : ''}</div><div class="say">${md(ev.result || '')}</div>`));
    $('#stats').innerHTML = [mins != null && `Last run: ${mins} min`, ev.num_turns && `${ev.num_turns} steps`].filter(Boolean).join('<br>');
  }
}
// Fallback when Claude forgets the [[phase:N]] markers: infer the step from what it is doing. Only moves forward.
function setPhase(n, mark) {
  if (n <= phase) return;
  phase = n; renderPhases();
  if (mark) add(div('phase-mark', `${n} · ${PHASES[n - 1]}`));
}
function inferPhase(t) {
  const i = t.input || {}; const f = rel(i.file_path || i.path || '').toLowerCase(); const cmd = (i.command || '').toLowerCase();
  let n = 0;
  if (t.name === 'Skill') n = 1;
  else if (['WebFetch', 'WebSearch'].includes(t.name) || (t.name === 'Read' && f.startsWith('inputs/'))) n = 2;
  else if (t.name === 'Write' || t.name === 'Edit' || t.name === 'MultiEdit') {
    if (/(^|\/)(9\d-|rebuild-spec)/.test(f)) n = 4;
    else if (/(^|\/)(prototype|firmware|cad|mechanical|enclosure|pcb|kicad|electronics|src)\/|\.(kicad_\w+|scad|stl|step|ino|cpp|c|h|py|js|ts|html)$/.test(f)) n = 5;
    else if (/(^|\/)[0-8]\d-[^/]*\.md$/.test(f)) n = /0[3-8]-|architecture|data-model|stack/.test(f) ? 3 : 4;
  }
  else if (t.name === 'Bash' && /kicad-cli (sch|pcb)|openscad |pio run|platformio run|arduino-cli compile|pytest|npm (run|test)/.test(cmd)) n = 5;
  if (n) setPhase(n, true);
}
function renderTodos(todos) {
  $('#planWrap').classList.toggle('hidden', !todos.length);
  $('#todos').innerHTML = todos.map(t => `<li class="${esc(t.status)}"><span>${t.status === 'completed' ? '✓' : t.status === 'in_progress' ? '▸' : '○'}</span><span>${esc(t.activeForm && t.status === 'in_progress' ? t.activeForm : t.content)}</span></li>`).join('');
}
async function refreshFiles() {
  if (!cur) return;
  const fs = await api(`/api/projects/${cur}/files`).catch(() => null); if (!fs) return;
  fs.sort((a, b) => a.path.localeCompare(b.path));
  if (!fs.length) { $('#files').innerHTML = '<li class="empty">Nothing yet.</li>'; return; }
  let html = '', lastDir = null;
  for (const f of fs) {
    const i = f.path.lastIndexOf('/'); const dir = i >= 0 ? f.path.slice(0, i) : '';
    if (dir !== lastDir) { if (dir) html += `<li class="dir">${esc(dir)}/</li>`; lastDir = dir; }
    const fresh = !firstFiles && !fileSeen.has(f.path);
    html += `<li data-path="${esc(f.path)}" class="${fresh ? 'fresh' : ''}" title="${esc(f.path)}"><span class="n">${esc(f.path.slice(i + 1))}</span></li>`;
  }
  if (firstFiles) fs.forEach(f => fileSeen.add(f.path));
  firstFiles = false;
  $('#files').innerHTML = html;
}
$('#files').onclick = e => { const li = e.target.closest('li[data-path]'); if (li) { fileSeen.add(li.dataset.path); li.classList.remove('fresh'); preview(li.dataset.path); } };
$('#stream').addEventListener('click', e => { const a = e.target.closest('a.file'); if (a) { e.preventDefault(); preview(a.dataset.path); } });

async function preview(p) {
  $('#pvPath').textContent = p; $('#drawer').classList.remove('hidden');
  const url = `/api/projects/${cur}/file?path=${encodeURIComponent(p)}`;
  const ext = p.split('.').pop().toLowerCase(); const pv = $('#pv');
  pv.style.padding = '';
  if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext)) pv.innerHTML = `<img src="${url}">`;
  else if (ext === 'pdf' || ext === 'html') { pv.style.padding = '0'; pv.innerHTML = `<iframe src="${url}"></iframe>`; }
  else if (['stl', 'step', 'stp', 'zip', 'gbr', 'drl', 'kicad_pcb', 'kicad_sch', 'kicad_pro', '3mf', 'exe', 'bin'].includes(ext))
    pv.innerHTML = `<p class="empty">This file opens in its own program (KiCad, a slicer, a CAD viewer). Use "Show in folder".</p>`;
  else {
    const t = await fetch(url).then(r => r.text()).catch(() => '');
    pv.innerHTML = ext === 'md' ? `<div class="say">${md(t)}</div>` : `<pre class="code">${esc(t.slice(0, 400000))}</pre>`;
  }
}
$('#pvClose').onclick = () => $('#drawer').classList.add('hidden');
$('#drawer').onclick = e => { if (e.target.id === 'drawer') $('#drawer').classList.add('hidden'); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#drawer').classList.add('hidden'); });
$('#pvReveal').onclick = () => api(`/api/projects/${cur}/reveal?path=${encodeURIComponent($('#pvPath').textContent)}`, { method: 'POST' });
$('#reveal').onclick = () => api(`/api/projects/${cur}/reveal`, { method: 'POST' });
$('#filesBtn').onclick = () => { const a = document.querySelector('aside.right'); a.style.display = a.style.display === 'block' ? '' : 'block'; };
$('#back').onclick = () => location.hash = '';
$('#stop').onclick = () => api(`/api/projects/${cur}/stop`, { method: 'POST' });
$('#replyGo').onclick = async () => {
  const m = $('#replyIn').value.trim(); if (!m || running) return;
  $('#replyIn').value = '';
  await api(`/api/projects/${cur}/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: m }) }).catch(e => alert(e.message));
};
$('#replyIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#replyGo').click(); } });

route();
</script>
