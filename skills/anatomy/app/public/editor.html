  <div class="sp"></div>

  <button class="btn" id="blenderBack" title="Bring the changes you saved in Blender back into the editor">Bring back</button>
  <button class="btn" id="render" title="Photoreal Cycles render in Blender (runs in the background)">Photoreal render</button>
  <button class="btn primary" id="rebuild" title="Make a new revision from these edits: CAD, drawings, BOM and G-code are regenerated">Rebuild as rev …</button>

<aside class="left">

  <div class="pane hidden" id="p-params"><input class="search" id="pq" placeholder="Search dimensions"><div id="params"></div></div>
  <div class="pane hidden" id="p-eng"></div>
  <div class="pane hidden" id="p-style"></div>
</aside>

<main id="main"><div class="load" id="load">Loading the design…</div>
  <div class="overlay">
    <div class="tb" id="look"><button data-l="studio" class="on" title="Materials and studio light">Studio</button><button data-l="clay" title="Plain clay, to judge the shapes">Clay</button><button data-l="lines" title="Clay with edges, to spot boxy parts">Lines</button><button data-l="xray" title="See through the shells">X-ray</button><button data-l="grade" title="Colour every part by its engineering grade: red concept, amber engineered, green verified">Grade</button></div>
    <div class="tb"><button id="ao" class="on" title="Ambient occlusion (soft contact shadows)">AO</button><button id="fit" title="Fit the whole product (F)">Fit</button><button id="shot" title="Save a picture of this view to the project">Snapshot</button></div>
  </div>
  <div class="hint" id="hint">Click a part · Shift-click to add · drag to orbit · right-drag to pan · W/E/R move/rotate/scale · F fit · Del remove</div>
</main>

<aside class="right"><div class="pane" id="insp"></div></aside>

</div>

  $('#st-src').textContent = D.assembly ? `Model: ${D.assembly}` : 'Model: part files (no assembly.json)';
  setEng(D.engineering);

  $('#blenderOpen').disabled = $('#render').disabled = !D.blender;
  if (!D.blender) { $('#blenderOpen').title = $('#render').title = 'Blender was not found on this PC (install it from blender.org)'; }
  if (!D.parts.length) { $('#load').textContent = 'This project has no 3D parts yet.'; return; }
  let n = 0;

  for (let w = 0; w < 6; w++) workers.push((async () => {

    }

  await Promise.all(workers);
  $('#load').classList.add('hidden');
  for (const p of P.values()) applyEdit(p);
  frame(); renderTree(); renderParams(); renderEng(); renderStyle(); renderInspector();
  $('#st-edits').innerHTML = `<b>${editCount()}</b> edits`; $('#st-save').textContent = D.edits?.saved ? 'Saved ' + new Date(D.edits.saved).toLocaleString() : 'Not saved yet';

  for (const [g, ps] of [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {

    <div class="xyz" style="grid-template-columns:60px 1fr"><span>Class</span><select id="iClass">${one ? '' : '<option value="">(keep each)</option>'}${Object.entries(CLASSES).map(([k, t]) => `<option value="${k}" ${k === cls ? 'selected' : ''} title="${esc(t)}">${k}</option>`).join('')}${one && !cls ? '<option value="" selected>(not set)</option>' : ''}</select></div>
    <div class="chips" id="iEng">${['Engineered', 'Verified'].map(x => `<span class="chip ${tgt === x ? 'on' : ''}" data-g="${x}" title="On rebuild: engineer to grade ${x}">Engineer to ${x}</span>`).join('')}</div>
    ${one && rec?.step ? `<div class="row"><button class="btn" id="iMeasure">Measure from STEP</button></div><div id="iFeat">${FEAT.has(p.file) ? featHtml(FEAT.get(p.file)) : ''}</div>` : ''}`;
}
function wireEng(ps, one) {
  $('#iClass').onchange = ev => { const v = ev.target.value; if (!v && !one) return; pushUndo();
    for (const x of ps) { const ed = partEdit(x.file); if (v && v !== engRec(x.file)?.class) ed.partClass = v; else delete ed.partClass; syncEdit(x); } changed(); renderInspector(); };
  $('#iEng').onclick = ev => { const c = ev.target.closest('[data-g]'); if (!c) return; pushUndo(); const on = !c.classList.contains('on');
    for (const x of ps) { const ed = partEdit(x.file); if (on) ed.engineer = c.dataset.g; else delete ed.engineer; syncEdit(x); } changed(); renderInspector(); renderTree(); };
  const mb = $('#iMeasure'); if (mb) mb.onclick = async () => {
    const step = engRec(ps[0].file).step; const out = $('#iFeat'); mb.disabled = true; out.innerHTML = '<p class="in">Reading the B-rep…</p>';
    try { const f = await api(`/api/projects/${id}/design/features?step=${encodeURIComponent(step)}`); FEAT.set(ps[0].file, f); out.innerHTML = featHtml(f); }
    catch (e) { out.innerHTML = `<p class="in" style="color:#ffb3b3">${esc(e.message)}</p>`; }
    mb.disabled = false;
  };
}
const FEAT = new Map();
function featHtml(f) {
  const bb = f.bbox_mm || [0, 0, 0];
  const holes = (f.holes || []).slice(0, 14);
  return `<div class="kv" style="margin-top:6px"><div>Envelope</div><div>${bb.map(v => r1(v)).join(' × ')} mm [${bb.map(inch).join(' × ')} in]</div>
    <div>Volume</div><div>${(f.volume_mm3 / 1000).toFixed(1)} cm³ [${(f.volume_mm3 / 16387.064).toFixed(2)} in³]</div>
    <div>Faces</div><div>${f.faces} (${Object.entries(f.face_types || {}).map(([k, n]) => n + ' ' + k.toLowerCase()).join(', ')})</div>
    <div>Fillets</div><div>${f.fillets}${f.fillet_radii_mm?.length ? ' · R ' + f.fillet_radii_mm.slice(0, 6).join(', ') + ' mm' : ''}</div><div>Chamfers</div><div>${f.chamfers}</div>
    <div>Holes</div><div>${f.hole_count}</div></div>
    ${f.primitive ? '<p class="in" style="color:#ffb3b3">This STEP is still a bare box or cylinder. It is a placeholder, not a part.</p>' : ''}
    ${holes.length ? `<table class="ft"><tr><td><b>Ø mm</b></td><td><b>Ø in</b></td><td><b>Depth mm [in]</b></td><td><b>Faces</b></td></tr>${holes.map(h => `<tr><td>${h.diameter_mm}</td><td>${h.diameter_in.toFixed(4)}</td><td>${h.depth_mm != null ? h.depth_mm + ' [' + inch(h.depth_mm) + ']' : ''}</td><td>${h.faces}</td></tr>`).join('')}</table>${f.holes.length > 14 ? `<p class="in">and ${f.holes.length - 14} more sizes</p>` : ''}` : ''}`;
}
function removeSel() {
  const ps = [...sel].map(f => P.get(f)); const restore = ps.every(x => x.e().removed);
  pushUndo(); for (const x of ps) { const ed = partEdit(x.file); if (restore) delete ed.removed; else ed.removed = true; syncEdit(x); applyEdit(x); }
  changed(); renderTree(); if (!restore) { gizmo.detach(); } renderInspector();
}
function liveInspector() {
  if (sel.size !== 1) return; const p = P.get([...sel][0]); const el = $('#insp');
  const t = p.pivot.position.clone().sub(p.center0), r = p.pivot.rotation, s = p.pivot.scale;
  const vals = { translate: [t.x, t.y, t.z].map(r1), rotate: [r.x, r.y, r.z].map(v => r1(THREE.MathUtils.radToDeg(v))), scale: [s.x, s.y, s.z].map(v => r1(v * 100)) };
  el.querySelectorAll('.xyz input').forEach(inp => { if (document.activeElement !== inp) { inp.value = vals[inp.dataset.t][+inp.dataset.k]; inp.classList.toggle('chg', inp.dataset.t === 'scale' ? Math.abs(inp.value - 100) > 0.05 : Math.abs(inp.value) > 0.05); } });
  const sz = $('#iSize'); if (sz) { const n = [p.size0.x * s.x, p.size0.y * s.y, p.size0.z * s.z]; sz.innerHTML = n.map(v => `${r1(v)}`).join(' × ') + ` mm<br><span class="in">${n.map(inch).join(' × ')} in</span>`; }
}

// ================================================================ looks
$('#look').onclick = e => { const l = e.target.dataset.l; if (!l) return; look = l; document.querySelectorAll('#look button').forEach(b => b.classList.toggle('on', b.dataset.l === l)); for (const p of P.values()) setMat(p); };
$('#ao').onclick = () => { gtao.enabled = !gtao.enabled; $('#ao').classList.toggle('on', gtao.enabled); };
$('#fit').onclick = () => frame();
function capture() { gizmo.visible = false; const o = outline.selectedObjects; outline.selectedObjects = []; composer.render(); const url = renderer.domElement.toDataURL('image/png'); gizmo.visible = true; outline.selectedObjects = o; return url; }
$('#shot').onclick = () => { const a = document.createElement('a'); a.href = capture(); a.download = `${id}-design.png`; a.click(); };

// ================================================================ Blender
function exportScene() { // Z-up mm -> glTF Y-up metres, one node per part with its origin at the part centre
  const root = new THREE.Scene();
  for (const p of P.values()) {
    if (p.e().removed) continue;
    const g = p.mesh.geometry.clone(); const pos = g.attributes.position, nor = g.attributes.normal;
    for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i); pos.setXYZ(i, x / 1000, z / 1000, -y / 1000); if (nor) { const a = nor.getX(i), b = nor.getY(i), c = nor.getZ(i); nor.setXYZ(i, a, c, -b); } }
    const src = makeMaterial(p.e().material || p.autoMat, p.e().color, 'studio');
    const sw = p.e().color || MATS[p.e().material || p.autoMat]?.swatch;
    const m = new THREE.MeshPhysicalMaterial({ color: sw ? new THREE.Color(sw) : src.color, metalness: src.metalness, roughness: src.roughness, clearcoat: src.clearcoat || 0, clearcoatRoughness: src.clearcoatRoughness || 0, transmission: src.transmission || 0, ior: src.ior || 1.5 }); // no KHR_materials_volume: Blender's importer fails on it without an attenuation distance
    m.name = p.e().material || p.autoMat;
    const node = new THREE.Mesh(g, m);
    const pp = p.pivot.position, q = p.pivot.quaternion, s = p.pivot.scale;
    node.position.set(pp.x / 1000, pp.z / 1000, -pp.y / 1000); node.quaternion.set(q.x, q.z, -q.y, q.w); node.scale.set(s.x, s.z, s.y);
    node.name = p.file.replace(/\.[^.]+$/, '');
    node.userData = { anatomy_file: p.file, anatomy_name: p.name, anatomy_material: m.name };
    root.add(node);
  }
  return new Promise((res, rej) => new GLTFExporter().parse(root, b => res(b), rej, { binary: true }));
}
async function sendToBlender(mode) {
  try {
    toast(mode === 'render' ? 'Preparing the photoreal render…' : 'Opening Blender…');
    const glb = await exportScene();
    await api(`/api/projects/${id}/design/scene`, { method: 'PUT', body: glb });
    const r = await api(`/api/projects/${id}/design/blender`, { method: 'POST', body: JSON.stringify({ mode, samples: 192 }) });
    if (mode === 'render') watchRender(r.out);
    else showModal(`<h2>Blender is opening</h2><p>The edited model opens in Blender with a studio already set up (floor, lights, camera). Sculpt, reshape, move parts or change materials there.</p>
      <p>When you are done, press <b>Ctrl+S</b> in Blender, then press <b>Bring back</b> here. Moved parts and new colours come straight into the editor; a sculpted part comes back as concept intent only: the rebuild rebuilds it as feature-based CAD (real holes, fits, fillets, material and process) and grades it from the STEP.</p><div class="row"><button class="btn primary" onclick="this.closest('.modal').classList.add('hidden')">OK</button></div>`);
  } catch (e) { showModal(`<h2>Blender could not start</h2><pre>${esc(e.message)}</pre><div class="row"><button class="btn" onclick="this.closest('.modal').classList.add('hidden')">Close</button></div>`); }
}
let renderWatch = null;
function watchRender(out) {
  $('#render').disabled = true; $('#render').textContent = 'Rendering…';
  clearInterval(renderWatch);
  renderWatch = setInterval(async () => {
    const s = await api(`/api/projects/${id}/design/blender`).catch(() => null); if (!s || !s.render) return;
    if (s.render.running) { $('#render').textContent = s.render.progress ? `Rendering · ${s.render.progress.replace('Sample ', '')}` : 'Rendering…'; return; }
    clearInterval(renderWatch); $('#render').disabled = false; $('#render').textContent = 'Photoreal render';
    D.renders = s.renders; renderRenders();
    if (s.render.ok) showModal(`<h2>Photoreal render</h2><img src="/p/${encodeURIComponent(id)}/${enc(s.render.out)}" style="width:100%;border-radius:8px"><p class="in">Saved in the project at ${esc(s.render.out)}.</p><div class="row"><button class="btn" id="mOpen">Open full size</button><button class="btn primary" onclick="this.closest('.modal').classList.add('hidden')">Close</button></div>`, () => { $('#mOpen').onclick = () => window.open(`/p/${encodeURIComponent(id)}/${enc(s.render.out)}`, '_blank'); });
    else showModal(`<h2>The render did not finish</h2><pre>${esc(s.render.tail || 'Blender stopped without an image.')}</pre><div class="row"><button class="btn" onclick="this.closest('.modal').classList.add('hidden')">Close</button></div>`);
  }, 2500);
}
$('#blenderOpen').onclick = () => sendToBlender('open');
$('#render').onclick = () => sendToBlender('render');
const colorDiff = (a, b) => { const x = new THREE.Color(a), y = new THREE.Color(b); return 255 * Math.max(Math.abs(x.r - y.r), Math.abs(x.g - y.g), Math.abs(x.b - y.b)); };
$('#blenderBack').onclick = async () => {
  const s = await api(`/api/projects/${id}/design/blender`).catch(() => null);
  const back = s && s.blenderReturn;
  if (!back || !back.parts) return showModal(`<h2>Nothing to bring back yet</h2><p>Open the model in Blender, make your changes, press <b>Ctrl+S</b> there, then try again.</p><div class="row"><button class="btn" onclick="this.closest('.modal').classList.add('hidden')">OK</button></div>`);
  pushUndo(); let moved = 0, sculpted = 0, painted = 0;
  for (const [file, r] of Object.entries(back.parts)) {
    const p = P.get(file); if (!p) continue;
    const before = p.pivot.matrix.clone();
    p.pivot.position.set(...r.position); p.pivot.quaternion.set(...r.quaternion); p.pivot.scale.set(...r.scale); p.pivot.updateMatrix();
    { const a = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3(); before.decompose(a, q, sc); if (a.distanceTo(p.pivot.position) > 0.05 || q.angleTo(p.pivot.quaternion) > 1e-4 || sc.distanceTo(p.pivot.scale) > 1e-4) moved++; }
    const ed = partEdit(file);
    if (r.color) { const mm = MATS[ed.material || p.autoMat] || {}; const was = ed.color || mm.swatch || mm.color; const now = r.color_linear ? '#' + new THREE.Color().setRGB(...r.color_linear).getHexString() : r.color; if (!was || colorDiff(was, now) > 12) { ed.color = now; painted++; } }
    if (r.hidden) ed.removed = true;
    if (r.mesh) {
      try {
        const buf = await (await fetch(`/api/projects/${id}/design/sculpt?file=${encodeURIComponent(r.mesh)}`, { cache: 'no-store' })).arrayBuffer();
        const g = prepGeometry([ldr.stl.parse(buf)]); p.mesh.geometry.dispose(); p.mesh.geometry = g; if (p.lines) { p.mesh.remove(p.lines); p.lines = null; }
        const st = meshStats(g); p.tris = st.tris; p.boxy = false; p.lowpoly = false;
        ed.mesh = 'inputs/sculpt/' + r.mesh; sculpted++;
      } catch {}
    }
    syncEdit(p); applyEdit(p);
  }
  changed(); renderTree(); renderInspector(); attachGizmo();
  toast(`From Blender: ${moved} moved, ${sculpted} sculpted, ${painted} recoloured`);
};

// ================================================================ rebuild
function updateRebuildLabel() { $('#rebuild').textContent = 'Rebuild as new revision'; }
function showModal(html, after) { $('#mbox').innerHTML = html; $('#modal').classList.remove('hidden'); if (after) after(); }
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.add('hidden'); };
$('#rebuild').onclick = async () => {
  await save();
  const n = editCount();
  const lines = [];
  const pe = Object.entries(edits.parts).filter(([, e]) => isEdited(e));
  if (Object.keys(edits.params).length) lines.push(`${Object.keys(edits.params).length} dimension change${Object.keys(edits.params).length === 1 ? '' : 's'}: ` + Object.entries(edits.params).slice(0, 6).map(([k, v]) => `${k} ${JSON.stringify(v.from)} → ${JSON.stringify(v.to)}`).join(', '));
  if (pe.length) lines.push(`${pe.length} part${pe.length === 1 ? '' : 's'} changed (moved, resized, restyled, re-materialed or removed)`);
  if (edits.global.style) lines.push('Design language: ' + edits.global.style);
  if (edits.global.autoStyle) lines.push('Restyle every boxy part: fillets, curves, real bought-part shapes');
  if (edits.global.notes) lines.push('Notes: ' + edits.global.notes.slice(0, 200));
  if (!n && !edits.global.autoStyle) return showModal(`<h2>No edits yet</h2><p>Change a part, a dimension or the styling first.</p><div class="row"><button class="btn" onclick="this.closest('.modal').classList.add('hidden')">OK</button></div>`);
  showModal(`<h2>Rebuild as a new revision?</h2>
    <p>Anatomy will copy this project as the next revision and apply your edits to the real CAD. Then it regenerates everything that depends on the shape: STEP and meshes, drawings and cut files (mm and inches), the BOM, G-code for printed parts, the assembly guide and the build package.</p>
    <p><b>This version is not changed.</b> Both versions show in your project list.</p>
    <pre>${esc(lines.join('\n'))}</pre>
    <p class="in">It runs like any Anatomy project, so you can watch it and steer it from the main window. A large product can take an hour or more.</p>
    <div class="row"><button class="btn primary" id="mGo">Rebuild</button><button class="btn" onclick="this.closest('.modal').classList.add('hidden')">Cancel</button></div>`, () => {
    $('#mGo').onclick = async () => {
      $('#mGo').disabled = true; $('#mGo').textContent = 'Starting…';
      try {
        sel.clear(); selChanged(); frame();
        await new Promise(r => setTimeout(r, 300));
        const r = await api(`/api/projects/${id}/design/revision`, { method: 'POST', body: JSON.stringify({ edits, snapshot: capture() }) });
        showModal(`<h2>Revision ${esc(r.revision)} started</h2><p>Anatomy is copying the design and will then rebuild it. Follow it in the main window, where it now shows as its own project.</p>
          <div class="row"><button class="btn primary" id="mShow">Show it in Anatomy</button><button class="btn" onclick="this.closest('.modal').classList.add('hidden')">Stay here</button></div>`, () => {
          $('#mShow').onclick = () => { try { if (window.opener && !window.opener.closed) { window.opener.location.hash = r.id; window.opener.focus(); } else window.open('/#' + r.id, '_blank'); } catch { window.open('/#' + r.id, '_blank'); } $('#modal').classList.add('hidden'); };
        });
      } catch (e) { showModal(`<h2>Could not start the rebuild</h2><pre>${esc(e.message)}</pre><div class="row"><button class="btn" onclick="this.closest('.modal').classList.add('hidden')">Close</button></div>`); }
    };
  });
};
addEventListener('beforeunload', () => { if (dirty) navigator.sendBeacon && fetch(`/api/projects/${id}/design/edits`, { method: 'PUT', body: JSON.stringify(edits), keepalive: true }); });

// ================================================================ loop
(function loop() { requestAnimationFrame(loop); orbit.update(); composer.render(); })();
if (!id) $('#load').textContent = 'No project given.'; else init().catch(e => { $('#load').textContent = 'Could not load the design: ' + e.message; });
</script>
