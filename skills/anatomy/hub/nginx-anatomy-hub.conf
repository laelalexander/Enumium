# Anatomy Hub behind nginx. Include this location block in the HTTPS server block of the hub's host name
# (see deploy.sh). Big uploads (G-code sets, STEP, PDFs) stream straight through to the hub.
location /anatomy-hub/ {
    proxy_pass http://127.0.0.1:4380/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 1100m;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
