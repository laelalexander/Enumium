<rect x="1500" y="1250" width="1000" height="124" fill="#fff" stroke="#111"/><text x="1510" y="1274" font-size="16" font-weight="bold">NOTES</text><text x="1510" y="1296" font-size="13">1. Cap: turn from Ø85 316 bar; the TC face and 2.5 in clamp taper must match ASME BPE DT-7 (check with a standard ferrule and gasket: no gap at the</text><text x="1528" y="1314" font-size="13">clamp).</text><text x="1510" y="1332" font-size="13">2. Press the bush in flush, then ream to Ø20.30-20.40. Clearance on the Ø20 f7 spigot 0.32-0.46 (UHMW swells and creeps; this runs dry at ≤ 150 rpm).</text><text x="1510" y="1350" font-size="13">3. Replace the bush when the screw tail drops more than 1 [.04] (ITP maintenance M2). Keep a spare bush per 3 feeders.</text><text x="1510" y="1368" font-size="13">4. Clamp: hex-nut 13MHHS only. The cap is the guard over the screw end: removing it needs a tool and the isolator locked off.</text>
