<rect x="1700" y="420" width="1150" height="148" fill="#fff" stroke="#111"/><text x="1710" y="444" font-size="17" font-weight="bold">NOTES</text><text x="1710" y="466" font-size="14">1. Feed CP-301 from its own breaker in MS-P1 (update the ELE load schedule: P1-301 = 230 V 1-ph, 40 A 2-pole, 8 AWG).</text><text x="1710" y="485" font-size="14">2. VFD output goes direct to the motor: no contactor or switch between U1 and the motor (STO stops the motor). Keep motor cable separate from 24 V wiring in the</text><text x="1728" y="504" font-size="14">duct (≥ 100 mm or a divider).</text><text x="1710" y="523" font-size="14">3. Bond the motor cable shield 360° at both ends (EMC gland at the panel, metal gland at the motor box). Earth the gearmotor through the cable PE, not the frame</text><text x="1728" y="542" font-size="14">alone.</text><text x="1710" y="561" font-size="14">4. Label every wire at both ends with the wire number shown; every terminal with its strip and number (E04).</text>
