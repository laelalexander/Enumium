"1455" y="373" font-size="12">wire 225-03-05</text><rect x="120" y="380" width="1780" height="24" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="397" font-size="12">306.A2</text><text x="345" y="397" font-size="12">KM-306 : A2</text><text x="705" y="397" font-size="12">0 V</text><text x="1125" y="397" font-size="12">18 AWG MTW blue/white</text><text x="1455" y="397" font-size="12"></text><rect x="120" y="404" width="1780" height="24" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="421" font-size="12">W-306C 2/3</text><text x="345" y="421" font-size="12">Q-306 : 13 / 14</text><text x="705" y="421" font-size="12">PLC DI_SifterIso (spare DI) / +24 V</text><text x="1125" y="421" font-size="12">2C 18 AWG TC-ER shielded</text><text x="1455" y="421" font-size="12">isolator ON = 1</text><rect x="120" y="428" width="1780" height="24" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="445" font-size="12">306.TR</text><text x="345" y="445" font-size="12">F-306 HKF1 : 13 / 14</text><text x="705" y="445" font-size="12">PLC DI_SifterTrip (spare DI) / +24 V</text><text x="1125" y="445" font-size="12">18 AWG panel</text><text x="1455" y="445" font-size="12">protector ON = 1</text><rect x="120" y="452" width="1780" height="24" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="469" font-size="12">P1-347</text><text x="345" y="469" font-size="12">body bracket (H5 at 90°)</text><text x="705" y="469" font-size="12">seat ring (H5 at 60°)</text><text x="1125" y="469" font-size="12">braid 16 mm², 250</text><text x="1455" y="469" font-size="12">bonds the isolated body (&lt; 1 Ω)</text>
<text x="120" y="531" font-size="18" font-weight="bold">CABLE SCHEDULE</text><rect x="120" y="540" width="1150" height="22" fill="#eceff1" stroke="#111"/><text x="125" y="555" font-size="12" font-weight="bold">CABLE</text><text x="265" y="555" font-size="12" font-weight="bold">FROM</text><text x="465" y="555" font-size="12" font-weight="bold">TO</text><text x="725" y="555" font-size="12" font-weight="bold">SPEC</text><text x="1145" y="555" font-size="12" font-weight="bold">EST. LENGTH</text><rect x="120" y="562" width="1150" height="22" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="577" font-size="12">W-306</text><text x="265" y="577" font-size="12">MS-P1</text><text x="465" y="577" font-size="12">Q-306</text><text x="725" y="577" font-size="12">3C 14 AWG TC-ER + G/Y, 600 V</text><text x="1145" y="577" font-size="12">12 m</text><rect x="120" y="584" width="1150" height="22" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="599" font-size="12">P1-350</text><text x="265" y="599" font-size="12">Q-306</text><text x="465" y="599" font-size="12">M-306</text><text x="725" y="599" font-size="12">SOOW 14/3 flexible, 600 V, oil/water resistant</text><text x="1145" y="599" font-size="12">3 m</text><rect x="120" y="606" width="1150" height="22" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="621" font-size="12">W-306C</text><text x="265" y="621" font-size="12">MS-P1</text><text x="465" y="621" font-size="12">Q-306 aux</text><text x="725" y="621" font-size="12">2C 18 AWG TC-ER shielded</text><text x="1145" y="621" font-size="12">12 m</text>
<text x="120" y="691" font-size="18" font-weight="bold">ISOLATOR Q-306 TERMINALS</text><rect x="120" y="700" width="860" height="24" fill="#eceff1" stroke="#111"/><text x="125" y="717" font-size="12" font-weight="bold">TERMINAL</text><text x="245" y="717" font-size="12" font-weight="bold">FUNCTION</text><text x="545" y="717" font-size="12" font-weight="bold">IN</text><text x="765" y="717" font-size="12" font-weight="bold">OUT</text><rect x="120" y="724" width="860" height="24" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="741" font-size="12">1 / 2</text><text x="245" y="741" font-size="12">L in / L out</text><text x="545" y="741" font-size="12">W-306 1</text><text x="765" y="741" font-size="12">P1-350 L</text><rect x="120" y="748" width="860" height="24" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="765" font-size="12">3 / 4</text><text x="245" y="765" font-size="12">N in / N out</text><text x="545" y="765" font-size="12">W-306 2</text><text x="765" y="765" font-size="12">P1-350 N</text><rect x="120" y="772" width="860" height="24" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="789" font-size="12">13 / 14</text><text x="245" y="789" font-size="12">early-break NO aux</text><text x="545" y="789" font-size="12">W-306C 2</text><text x="765" y="789" font-size="12">W-306C 3</text><rect x="120" y="796" width="860" height="24" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="125" y="813" font-size="12">PE</text><text x="245" y="813" font-size="12">earth</text><text x="545" y="813" font-size="12">W-306 G/Y</text><text x="765" y="813" font-size="12">P1-350 PE</text>
<text x="1400" y="531" font-size="18" font-weight="bold">PLC / MES SEQUENCE (blender discharge)</text><rect x="1400" y="540" width="1480" height="26" fill="#eceff1" stroke="#111"/><text x="1405" y="559" font-size="12" font-weight="bold">STEP (MES batch / PLC)</text><text x="1765" y="559" font-size="12" font-weight="bold">CONDITION</text><text x="2325" y="559" font-size="12" font-weight="bold">ACTION</text><rect x="1400" y="566" width="1480" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="1405" y="585" font-size="12">1 Ready</text><text x="1765" y="585" font-size="12">drum on dolly under the sifter, lid latched, sock clamped (operator check on HMI)</text><text x="2325" y="585" font-size="12">enable &#x27;discharge&#x27; on the HMI</text><rect x="1400" y="592" width="1480" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="1405" y="611" font-size="12">2 Start</text><text x="1765" y="611" font-size="12">DI_SifterIso = 1 and DI_SifterTrip = 1</text><text x="2325" y="611" font-size="12">DO_SifterVib = 1, wait 3 s (run-up), then DO_BlValveOpen = 1</text><rect x="1400" y="618" width="1480" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="1405" y="637" font-size="12">3 Discharge</text><text x="1765" y="637" font-size="12">valve open; blender agitator at discharge speed</text><text x="2325" y="637" font-size="12">batch empties ≈ 19 min at 3.6 kg/min</text><rect x="1400" y="644" width="1480" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="1405" y="663" font-size="12">4 Run-on</text><text x="1765" y="663" font-size="12">valve closed (MES: blender empty)</text><text x="2325" y="663" font-size="12">vibrator runs 60 s more to clear the deck, then DO_SifterVib = 0</text><rect x="1400" y="670" width="1480" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="1405" y="689" font-size="12">5 Check</text><text x="1765" y="689" font-size="12">operator opens the lid (LOTO not needed: vibrator stopped, latch only)</text><text x="2325" y="689" font-size="12">inspect deck + magnet, log overs and catches (ITP T18/T19)</text><rect x="1400" y="696" width="1480" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="1405" y="715" font-size="12">Alarm</text><text x="1765" y="715" font-size="12">DI_SifterIso = 0 or DI_SifterTrip = 0 while discharging</text><text x="2325" y="715" font-size="12">close the valve at once (no unsifted product), alarm on the MES</text>
<rect x="1400" y="820" width="1500" height="88" fill="#fff" stroke="#111"/><text x="1410" y="844" font-size="16" font-weight="bold">CONTROL NOTES</text><text x="1410" y="866" font-size="13">1. The valve never opens unless the vibrator has run up: unsifted blend must not reach the drum (the screen is a quality control point, not the CCP).</text><text x="1410" y="884" font-size="13">2. Vibrator: 3600 rpm, weights set to ≈ 78 % of 2.0 kN for ±0.3 mm; record the setting on the ITP and paint-mark the weights.</text><text x="1410" y="902" font-size="13">3. Startup / stop pass through the isolator resonance (≈ 11 Hz) in &lt; 1 s: a brief wobble is normal, hard knocking is not (check the band slack and isolator nuts).</text>
</svg>