<text x="1000" y="550" font-size="13" text-anchor="start" fill="#111">Isolator OFF: aux opens first → PLC drops DO_SifterVib before the poles break → no switching under load.</text>
<text x="1000" y="570" font-size="13" text-anchor="start" fill="#b00020">Assign the two spare DI channels in io_p1.json (P1-225 slot 2) when the panel is built; they only alarm, they do not interlock safety.</text>
<text x="1000" y="631" font-size="18" font-weight="bold">COMPONENTS</text><rect x="1000" y="640" width="1360" height="22" fill="#eceff1" stroke="#111"/><text x="1005" y="655" font-size="12" font-weight="bold">TAG</text><text x="1115" y="655" font-size="12" font-weight="bold">DESCRIPTION</text><text x="1815" y="655" font-size="12" font-weight="bold">PART</text><text x="2145" y="655" font-size="12" font-weight="bold">WHERE</text><text x="2315" y="655" font-size="12" font-weight="bold">QTY</text><rect x="1000" y="662" width="1360" height="22" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="1005" y="677" font-size="12">CB-306</text><text x="1115" y="677" font-size="12">Circuit breaker 1-pole 15 A, 10 kA, 120 V branch (existing schedule M-306)</text><text x="1815" y="677" font-size="12">ABB S201-C15 (or panel standard)</text><text x="2145" y="677" font-size="12">MS-P1</text><text x="2315" y="677" font-size="12">1</text><rect x="1000" y="684" width="1360" height="22" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="1005" y="699" font-size="12">F-306</text><text x="1115" y="699" font-size="12">Manual motor protector 2.5-4.0 A, set to vibrator FLA; 1-ph: wire through all 3 poles in series</text><text x="1815" y="699" font-size="12">ABB MS116-4.0 + HKF1-11 aux (P1-349)</text><text x="2145" y="699" font-size="12">MS-P1</text><text x="2315" y="699" font-size="12">1</text><rect x="1000" y="706" width="1360" height="22" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="1005" y="721" font-size="12">KM-306</text><text x="1115" y="721" font-size="12">Contactor 9 A 3-pole, 24 V DC coil, + 1 NO aux</text><text x="1815" y="721" font-size="12">ABB AF09-30-10-13 (P1-349)</text><text x="2145" y="721" font-size="12">MS-P1</text><text x="2315" y="721" font-size="12">1</text><rect x="1000" y="728" width="1360" height="22" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="1005" y="743" font-size="12">Q-306</text><text x="1115" y="743" font-size="12">Motor isolator 2-pole 16 A, lockable OFF, early-break NO aux, IP66 (P1-348)</text><text x="1815" y="743" font-size="12">ABB OTP16T2M + OA1G10</text><text x="2145" y="743" font-size="12">blender frame leg</text><text x="2315" y="743" font-size="12">1</text><rect x="1000" y="750" width="1360" height="22" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="1005" y="765" font-size="12">M-306</text><text x="1115" y="765" font-size="12">Rotary vibrator 115 V 1-ph 60 Hz 2-pole, ≈ 2.9 A FLA (P1-306)</text><text x="1815" y="765" font-size="12">OLI MVE 200/36 class 1-ph (confirm)</text><text x="2145" y="765" font-size="12">sifter bracket</text><text x="2315" y="765" font-size="12">1</text><rect x="1000" y="772" width="1360" height="22" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="1005" y="787" font-size="12">X-306</text><text x="1115" y="787" font-size="12">Terminal block 4 x 4 mm² + PE in the isolator enclosure</text><text x="1815" y="787" font-size="12">Phoenix UT 4 (or equal)</text><text x="2145" y="787" font-size="12">Q-306</text><text x="2315" y="787" font-size="12">1</text>
<rect x="1000" y="840" width="1360" height="106" fill="#fff" stroke="#111"/><text x="1010" y="864" font-size="16" font-weight="bold">NOTES</text><text x="1010" y="886" font-size="13">1. Load: 1 x ≈ 2.9 A at 120 V (confirm nameplate); breaker 15 A, cable 14 AWG; voltage drop on 15 m &lt; 1 %.</text><text x="1010" y="904" font-size="13">2. Disconnect in sight (NEC 430.102(B)): Q-306 on the blender frame leg; LOTO before opening the lid or adjusting the weights.</text><text x="1010" y="922" font-size="13">3. Single-phase vibrators start on a run capacitor: never reverse at speed; direction does not matter for a vertical-axis gyratory drive.</text><text x="1010" y="940" font-size="13">4. Flexible cord only between the isolator and the vibrator (the body moves ±0.3 mm and the drum is changed every batch).</text>
