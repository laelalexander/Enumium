<text x="120" y="200" font-size="56" font-weight="bold">Down Home Creole</text><text x="120" y="270" font-size="36">Phase 1 prototype spice plant · drawing set</text><text x="120" y="330" font-size="22">1,000 lb a week of blended seasonings · 5 launch blends, laid out for 13 · bins with automatic dosing · in-house stainless fabrication</text>
<text x="140" y="400" font-size="20">• 9 of 12 bin positions used; 82.5 % of blend weight dosed automatically</text>
<text x="140" y="434" font-size="20">• Built in house: 6 cu ft ribbon blender (no riser stand), 7 batches a week; 9 bin feeders</text>
<text x="140" y="468" font-size="20">• Drum-top sifter 12 mesh with magnet on the drum under the blender; hammer mill with feed magnet for whole spices</text>
<text x="140" y="502" font-size="20">• Pack bench with built servo auger filler, spindle capper, wrap labeler and detector conveyor (used head, CCP-1)</text>
<text x="140" y="536" font-size="20">• Equipment 113 lines, $185,753 (bought and fabricated), see bom/phase1-bom.xlsx</text>
<text x="140" y="570" font-size="20">• All dimensions mm [in]; DXF cut files in mm and inch in dxf/</text>
