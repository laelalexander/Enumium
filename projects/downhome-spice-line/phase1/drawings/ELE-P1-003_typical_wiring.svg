<rect x="2636" y="1340" width="796" height="125" fill="#fff" stroke="#111"/><text x="2646" y="1362" font-size="16" font-weight="bold">NOTES</text><text x="2646" y="1384" font-size="13">1. Wire numbers are 225-slot-channel for PLC I/O and SF-nn for the safety loop; every wire is ferruled at both ends.</text><text x="2646" y="1403" font-size="13">2. Bins B02-B12 repeat sections A rungs 2-3 and B with their own slot channels, cables W-P12...W-P22 and drives #2-#9.</text><text x="2646" y="1422" font-size="13">3. Safety functions are hard-wired through SR-P1. The PLC only reads SR-P1&#x27;s status.</text><text x="2646" y="1441" font-size="13">4. 24 V DC: PS-1 10 A for I/O and actuator, PS-2 2 A for the PFC200 and 880 interface (separate fuses).</text><text x="2646" y="1460" font-size="13">5. Field cables: 18 AWG [0.82 mm²] TC-ER; shields grounded at the panel end only.</text>
