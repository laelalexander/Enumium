<rect x="2636" y="1300" width="796" height="144" fill="#fff" stroke="#111"/><text x="2646" y="1322" font-size="16" font-weight="bold">NOTES</text><text x="2646" y="1344" font-size="13">1. Motor FLA from NEC Tables 430.248 (1-ph) and 430.250 (3-ph) at 208 V; conductors at 125 % FLA.</text><text x="2646" y="1363" font-size="13">2. Drive input current from the GS21 manual (VERIFY); 2 drives per 20 A 2-pole breaker.</text><text x="2646" y="1382" font-size="13">3. Feeder motors, screw, blender and mill stop on SR-P1 (drive STO and contactor), not on PLC outputs alone.</text><text x="2646" y="1401" font-size="13">4. Electrical class in the dosing room per the dust hazard analysis (NFPA 652 / 61).</text><text x="2646" y="1420" font-size="13">5. Panels P1-225 and MS-P1 stainless Type 4X, dry-clean area, no hoses.</text><text x="2646" y="1439" font-size="13">6. A licensed electrician installs; final design to NEC 2023 and NFPA 79 for machines.</text>
