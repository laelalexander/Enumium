<text x="400.0" y="1357.9" font-size="12" text-anchor="start" fill="#111">ENDS SQUARE TO THE BORE 0.02, ∥ 0.02, CHAMFER 0.2 x 45° BOTH ENDS</text>
<text x="400.0" y="1373.9" font-size="12" text-anchor="start" fill="#111">Ra 1.6 µm on the end faces (they carry the stack preload)</text>
<rect x="160" y="1450" width="2200" height="142" fill="#fff" stroke="#111"/><text x="170" y="1474" font-size="16" font-weight="bold">NOTES</text><text x="170" y="1496" font-size="13">1. The stack is a clamped column on each rod: -Z frame (rod tapped through it) / spacers / boards / mid frame / spacers / board / +Z frame, preloaded by the hex standoff H7 on the rod above the +Z frame.</text><text x="170" y="1514" font-size="13">2. Frames are located by the rails, so the last spacer under the mid frame (-04) and under the +Z frame (-06) is cut to fit: build the bay, measure the gap at each rod with gauge blocks, face the spacer to the gap minus 0.05-0.10, so the H7 preload compresses the column, not the rails.</text><text x="170" y="1532" font-size="13">3. Rod preload: torque H7 to 0.6 N·m [5.3 lbf·in] against the +Z frame. Rod stress ≈ 190 MPa at 0.6 N·m (K = 0.2) on the M3 stress area 5.03 mm², 23 % of Ti-6Al-4V yield.</text><text x="170" y="1550" font-size="13">4. Rod ends: deburr the cut ends, start the thread with a die; thin nut H3 under the -Z end board, standoff H7 at the +Z end; stake both with 2216 (no thread locker).</text><text x="170" y="1568" font-size="13">5. Spacers: lathe from Ø6 6061-T6 bar; drill and ream Ø3.2; part off, then face to length in a collet stop; mark the dash number on the bag tag.</text><text x="170" y="1586" font-size="13">6. First natural frequency target &gt; 100 Hz for the stack (verify in the sine survey, AON-900 T15).</text>
</svg>