<text x="90" y="131" font-size="17" font-weight="bold">TESTS</text><rect x="90" y="140" width="2460" height="26" fill="#eceff1" stroke="#111"/><text x="95" y="159" font-size="11" font-weight="bold">TEST</text><text x="155" y="159" font-size="11" font-weight="bold">WHAT IS CHECKED</text><text x="1655" y="159" font-size="11" font-weight="bold">LIMIT</text><text x="1985" y="159" font-size="11" font-weight="bold">WHEN</text><text x="2205" y="159" font-size="11" font-weight="bold">BY</text><text x="2275" y="159" font-size="11" font-weight="bold">RESULT / SIGN</text><rect x="90" y="166" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="185" font-size="11">T1</text><text x="155" y="185" font-size="11">Material certs (6061-T6, 5052, Ti-6Al-4V, A4 fasteners), outgassing data for every non-metal</text><text x="1655" y="185" font-size="11">on file</text><text x="1985" y="185" font-size="11">receiving</text><text x="2205" y="185" font-size="11">QA</text><rect x="90" y="192" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="211" font-size="11">T2</text><text x="155" y="211" font-size="11">Frames AON-103/4/5: bar span 83.00 +0/-0.05, thickness 10.00 ±0.05, flatness 0.05, hole table</text><text x="1655" y="211" font-size="11">per drawing</text><text x="1985" y="211" font-size="11">after machining</text><text x="2205" y="211" font-size="11">QC</text><rect x="90" y="218" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="237" font-size="11">T3</text><text x="155" y="237" font-size="11">Rails: 8.50 ±0.02 after anodise all faces, length 340.50 ±0.10, straightness 0.05, R1 edges, csk flush</text><text x="1655" y="237" font-size="11">per drawing</text><text x="1985" y="237" font-size="11">after anodise</text><text x="2205" y="237" font-size="11">QC</text><rect x="90" y="244" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="263" font-size="11">T4</text><text x="155" y="263" font-size="11">Squareness of the assembled structure: envelope 100.0 ±0.1 at 3 heights, diagonals equal 0.1, rail ends coplanar 0.1</text><text x="1655" y="263" font-size="11">pass</text><text x="1985" y="263" font-size="11">after step 6</text><text x="2205" y="263" font-size="11">QC</text><rect x="90" y="270" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="289" font-size="11">T5</text><text x="155" y="289" font-size="11">Fit check in the AODV-1 dispenser / a 3U test pod: slides under its own weight, no binding</text><text x="1655" y="289" font-size="11">pass</text><text x="1985" y="289" font-size="11">after step 7</text><text x="2205" y="289" font-size="11">I&amp;T</text><rect x="90" y="296" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="315" font-size="11">T6</text><text x="155" y="315" font-size="11">Deployment switches: open when the lever is flush with the rail end, closed at ≥ 1.0 proud; spring plungers 3-7 N</text><text x="1655" y="315" font-size="11">pass</text><text x="1985" y="315" font-size="11">after step 6</text><text x="2205" y="315" font-size="11">I&amp;T</text><rect x="90" y="322" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="341" font-size="11">T7</text><text x="155" y="341" font-size="11">Board bring-up E01-E07 (each board&#x27;s own bring-up list, KiCad packages)</text><text x="1655" y="341" font-size="11">pass</text><text x="1985" y="341" font-size="11">before stack</text><text x="2205" y="341" font-size="11">EE</text><rect x="90" y="348" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="367" font-size="11">T8</text><text x="155" y="367" font-size="11">Battery cell screening per NASA JSC-20793: capacity, DCIR, OCV match ±10 mV, vacuum leak (mass loss)</text><text x="1655" y="367" font-size="11">pass</text><text x="1985" y="367" font-size="11">before E02</text><text x="2205" y="367" font-size="11">EE</text><rect x="90" y="374" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="393" font-size="11">T9</text><text x="155" y="393" font-size="11">Harness continuity, 500 V DC insulation &gt; 100 MΩ, pull test</text><text x="1655" y="393" font-size="11">pass</text><text x="1985" y="393" font-size="11">before install</text><text x="2205" y="393" font-size="11">EE</text><rect x="90" y="400" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="419" font-size="11">T10</text><text x="155" y="419" font-size="11">Inhibit test: with SW1, SW2 pressed and RBF fitted, no voltage on VBATT bus, COM or BURN; each inhibit alone also blocks</text><text x="1655" y="419" font-size="11">0 V</text><text x="1985" y="419" font-size="11">flight config</text><text x="2205" y="419" font-size="11">I&amp;T</text><rect x="90" y="426" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="445" font-size="11">T11</text><text x="155" y="445" font-size="11">Bonding: any panel / board ground ring to the rails</text><text x="1655" y="445" font-size="11">&lt; 10 mΩ</text><text x="1985" y="445" font-size="11">after step 7</text><text x="2205" y="445" font-size="11">I&amp;T</text><rect x="90" y="452" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="471" font-size="11">T12</text><text x="155" y="471" font-size="11">Deployment timeline: release the switches, verify burn at ≥ 30:00 and first RF at ≥ 45:00 (stopwatch + SDR)</text><text x="1655" y="471" font-size="11">pass</text><text x="1985" y="471" font-size="11">functional</text><text x="2205" y="471" font-size="11">I&amp;T</text><rect x="90" y="478" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="497" font-size="11">T13</text><text x="155" y="497" font-size="11">Mass and CG (3 load cells)</text><text x="1655" y="497" font-size="11">≤ 6000 g; CG per AON-001</text><text x="1985" y="497" font-size="11">flight config</text><text x="2205" y="497" font-size="11">I&amp;T</text><rect x="90" y="504" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="523" font-size="11">T14</text><text x="155" y="523" font-size="11">Antenna deployment (ambient, then cold -20 °C): both elements release within 1 burn; VSWR &lt; 1.5 at 401.5 MHz deployed</text><text x="1655" y="523" font-size="11">pass</text><text x="1985" y="523" font-size="11">functional</text><text x="2205" y="523" font-size="11">RF</text><rect x="90" y="530" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="549" font-size="11">T15</text><text x="155" y="549" font-size="11">Sine survey 0.25 g 5-2000 Hz each axis before and after random: first mode &gt; 100 Hz, shift &lt; 5 %</text><text x="1655" y="549" font-size="11">pass</text><text x="1985" y="549" font-size="11">environmental</text><text x="2205" y="549" font-size="11">ENV</text><rect x="90" y="556" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="575" font-size="11">T16</text><text x="155" y="575" font-size="11">Random vibration, GSFC-STD-7000B: qualification 14.1 grms 2 min/axis (EM), acceptance 6.8 grms 1 min/axis (FM); replace with the launcher&#x27;s levels</text><text x="1655" y="575" font-size="11">no damage, functional</text><text x="1985" y="575" font-size="11">environmental</text><text x="2205" y="575" font-size="11">ENV</text><rect x="90" y="582" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="601" font-size="11">T17</text><text x="155" y="601" font-size="11">Thermal vacuum &lt; 1e-5 torr, -20 °C to +50 °C operating, 4 cycles (acceptance) / 8 cycles (qual); hot and cold starts</text><text x="1655" y="601" font-size="11">functional each plateau</text><text x="1985" y="601" font-size="11">environmental</text><text x="2205" y="601" font-size="11">ENV</text><rect x="90" y="608" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="627" font-size="11">T18</text><text x="155" y="627" font-size="11">Bake-out 70 °C 24 h in vacuum with TQCM; end when the TQCM rate is below the launcher&#x27;s limit</text><text x="1655" y="627" font-size="11">pass</text><text x="1985" y="627" font-size="11">before delivery</text><text x="2205" y="627" font-size="11">ENV</text><rect x="90" y="634" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="653" font-size="11">T19</text><text x="155" y="653" font-size="11">RF: TX power 33 dBm ±1, frequency ±1 kHz, spurious per the FCC licence mask; RX sensitivity -117 dBm at 1e-5 BER</text><text x="1655" y="653" font-size="11">pass</text><text x="1985" y="653" font-size="11">functional</text><text x="2205" y="653" font-size="11">RF</text><rect x="90" y="660" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="679" font-size="11">T20</text><text x="155" y="679" font-size="11">End-to-end: ground station + AOMC → authenticated command, HK beacon decode, store-and-forward round trip</text><text x="1655" y="679" font-size="11">pass</text><text x="1985" y="679" font-size="11">functional</text><text x="2205" y="679" font-size="11">SW</text><rect x="90" y="686" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="705" font-size="11">T21</text><text x="155" y="705" font-size="11">Security: replayed, forged and bit-flipped commands rejected (EOR-1 tests + on hardware)</text><text x="1655" y="705" font-size="11">pass</text><text x="1985" y="705" font-size="11">functional</text><text x="2205" y="705" font-size="11">SW</text><rect x="90" y="712" width="2460" height="26" fill="#fafafa" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="731" font-size="11">T22</text><text x="155" y="731" font-size="11">Day-in-the-life: 72 h on the sun simulator / lab supply profile, all modes, safe-mode entry and exit</text><text x="1655" y="731" font-size="11">no resets</text><text x="1985" y="731" font-size="11">system</text><text x="2205" y="731" font-size="11">I&amp;T</text><rect x="90" y="738" width="2460" height="26" fill="#fff" stroke="#b0bec5" stroke-width="0.6"/><text x="95" y="757" font-size="11">T23</text><text x="155" y="757" font-size="11">Final RBF-out check, battery at 40-60 % SOC for storage/launch, photos of every face, sign-off</text><text x="1655" y="757" font-size="11">pass</text><text x="1985" y="757" font-size="11">delivery</text><text x="2205" y="757" font-size="11">QA</text>
<rect x="90" y="824" width="2400" height="106" fill="#fff" stroke="#111"/><text x="100" y="848" font-size="16" font-weight="bold">NOTES</text><text x="100" y="870" font-size="13">1. Models: build one engineering model (EM) for qualification (T15-T17 at qual levels) and the flight model (FM) for acceptance. The EM can use commercial cells instead of CIC.</text><text x="100" y="888" font-size="13">2. Vibration levels: GSFC-STD-7000B generalised random (workmanship 6.8 grms) is a placeholder; AODV-1&#x27;s own environment comes from the vehicle program (30-launch-vehicle-concept.md) and any rideshare ICD.</text><text x="100" y="906" font-size="13">3. Battery safety: JSC-20793 screening and the 2-fault-tolerant protection on E02 are needed for any launch provider&#x27;s safety review.</text><text x="100" y="924" font-size="13">4. Every test result goes in the traveller; nonconformances are raised as ECOs (supply-and-change process).</text>
</svg>