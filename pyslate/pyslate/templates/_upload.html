<form id="upload" class="upload-card" action="/quote" method="post" enctype="multipart/form-data">
  <label class="dropzone" for="files">
    <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <span class="dz-title">Drop files here or choose files</span>
    <span class="dz-sub">{{ formats | map('upper') | join(' · ') | replace('.', '') }}</span>
    <input id="files" name="files" type="file" multiple required accept="{{ formats | join(',') }}">
  </label>
  <p class="file-list" id="file-list" aria-live="polite"></p>
  <button class="button wide" type="submit">Get instant quote</button>
  <p class="fine">Up to 20 files, 50 MB each. Your files are only used to quote and make your order.</p>
</form>
<script>
(() => {
  const input = document.getElementById('files'), list = document.getElementById('file-list'), zone = document.querySelector('.dropzone');
  const show = () => { list.textContent = [...input.files].map(f => f.name).join(', '); };
  input.addEventListener('change', show);
  ['dragenter', 'dragover'].forEach(e => zone.addEventListener(e, ev => { ev.preventDefault(); zone.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => zone.addEventListener(e, () => zone.classList.remove('over')));
  zone.addEventListener('drop', ev => { ev.preventDefault(); input.files = ev.dataTransfer.files; show(); });
})();
</script>
