{% extends "base.html" %}
{% block title %}Sign in · Pyslate{% endblock %}
{% block content %}
<div class="wrap narrow account-auth">
  <h1>Sign in</h1>
  <p class="lead">See your orders, reopen saved quotes and designs, and manage how you pay.</p>
  <form method="post" action="/account/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Email <input name="email" type="email" required autocomplete="email" value="{{ form.email or '' }}"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
    <button class="button wide">Sign in</button>
  </form>
  <p class="fine">New here? <a href="/account/signup?next={{ next | urlencode }}">Create an account</a>. You can also order without one.</p>
</div>
{% endblock %}
