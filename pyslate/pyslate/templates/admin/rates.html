{% extends "admin/base.html" %}
{% block admin %}
<h1>Rates and machines</h1>
<p>Edit materials, machine beds, hourly rates, setup fees, margin and quantity breaks. New quotes use these values right away; placed orders keep their price.</p>
{% if saved %}<p class="notice">Saved.</p>{% endif %}
<form method="post" action="/admin/rates" class="stack">
  <textarea name="profile" rows="40" spellcheck="false" class="code">{{ text }}</textarea>
  <button class="button">Save</button>
</form>
{% endblock %}
