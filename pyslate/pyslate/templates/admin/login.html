{% extends "base.html" %}
{% block title %}Shop sign in · Pyslate{% endblock %}
{% block content %}
<div class="wrap narrow">
  <h1>Shop console</h1>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/login" class="stack">
    <label>Password <input name="token" type="password" required autocomplete="current-password"></label>
    <button class="button">Sign in</button>
  </form>
</div>
{% endblock %}
