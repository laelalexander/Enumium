# nginx site for pyslate.com on the Droplet that already serves Pyrails.com.
# Put it in /etc/nginx/sites-available/pyslate, link it into sites-enabled,
# then run: sudo certbot --nginx -d pyslate.com -d www.pyslate.com
server {
    listen 80;
    server_name pyslate.com www.pyslate.com;

    # Uploads are capped in the app too (PYSLATE_MAX_UPLOAD_MB); keep this a bit higher.
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
