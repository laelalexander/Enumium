{% extends "base.html" %}
{% block title %}Create an account · Pyslate{% endblock %}
{% block content %}
<div class="wrap narrow account-auth">
  <h1>Create an account</h1>
  <p class="lead">Keep every order in one place, save quotes and studio designs for later, and keep a card on file with Stripe.</p>
  <form method="post" action="/account/signup" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Name <input name="name" autocomplete="name" maxlength="255" value="{{ form.name or '' }}"></label>
    <label>Email <input name="email" type="email" required autocomplete="email" maxlength="255" value="{{ form.email or '' }}"></label>
    <label>Password <input name="password" type="password" required minlength="10" autocomplete="new-password">
      <span class="fine">At least 10 characters.</span></label>
    <button class="button wide">Create account</button>
  </form>
  <p class="fine">Already have one? <a href="/account/login?next={{ next | urlencode }}">Sign in</a>.</p>
</div>
{% endblock %}
